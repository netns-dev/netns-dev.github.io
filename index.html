<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>netns.dev</title>
<meta name="description" content="netns.dev">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#04150c">
<style>
  *{ margin:0; box-sizing:border-box; }
  body{
    background:#04150c;
    /* shows through the canvas when WebGL is unavailable or the shader fails */
    background-image:radial-gradient(620px 420px at 50% 50%, rgba(0,230,156,.10), transparent 72%);
    color:#00e69c;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100vh;
    display:grid; place-items:center;
    padding:24px;
  }
  canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  /* The dot-matrix title is drawn by the shader along with the background, so this
     heading is kept out of the way: it still names the page for search engines and
     screen readers, and .fallback turns it back into the visible title if WebGL
     cannot start (in which case effects run on the background only). */
  #title{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip-path:inset(50%); white-space:nowrap; border:0; padding:0;
  }
  #title.fallback{
    position:static; width:auto; height:auto; overflow:visible; clip-path:none;
    font-size:2rem; font-weight:600; letter-spacing:.02em;
    color:#eafff5; cursor:pointer; user-select:none;
    text-shadow:0 0 8px rgba(0,230,156,.85), 0 0 24px rgba(0,230,156,.55), 0 0 60px rgba(0,230,156,.4);
  }
  #title.fallback span{ text-shadow:inherit; }
  #title.fallback span:last-child{ color:#00e69c; }

</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <h1 id="title"><span>netns</span><span>.dev</span></h1>

  <!-- The page has no controls of its own. The effects are driven from the
       browser console (see netns.help), from a click on the title, and from the
       konami code. -->

<script>
/* ============ state shared with the renderer ============ */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rnd = (a, b) => a + Math.random() * (b - a);
const between = (a, b) => Math.random() < .5 ? -1 : 1;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* Per-run envelopes for the background, and the title's own pose. The renderer
   reads both every frame; the bins write them. Every activation redraws its
   durations, jolt counts and rhythm, so no two runs look alike. */
const FX = { surge: null, blackout: null, glitch: null };
const T  = { op: 1, jx: 0, jy: 0, skew: 0, red: 0 };

/* ============ dot-matrix title ============ */
/* 5x5 glyph bitmaps, one bit per column (MSB = leftmost), same grid as favicon.svg */
const FONT = {
  'N': [0b10001, 0b11001, 0b10101, 0b10011, 0b10001],
  'E': [0b11111, 0b10000, 0b11110, 0b10000, 0b11111],
  'T': [0b11111, 0b00100, 0b00100, 0b00100, 0b00100],
  'S': [0b01111, 0b10000, 0b01110, 0b00001, 0b11110],
  'D': [0b11110, 0b10001, 0b10001, 0b10001, 0b11110],
  'V': [0b10001, 0b10001, 0b10101, 0b01010, 0b00100],
  '.': [0b00000, 0b00000, 0b00000, 0b00110, 0b00110],
};
const WORD  = 'NETNS.DEV';
const NCHAR = WORD.length;                             // 9
const GLYPH_W = 5, GLYPH_GAP = 1;
const COLS = NCHAR * (GLYPH_W + GLYPH_GAP) - GLYPH_GAP; // 53 dot columns
const ROWS = 5;
const TEX_W = 64, TEX_H = 8;                           // power-of-two, mostly empty

/* One texel per dot, x = char*5 + column, y = row. Passing null for a character
   paints garbage segments, which is what the decrypt effect scrambles through. */
function dotTexture(shown){
  const buf = new Uint8Array(TEX_W * TEX_H);
  for (let c = 0; c < NCHAR; c++){
    const rows = shown[c] ? FONT[shown[c]] : null;
    for (let r = 0; r < ROWS; r++){
      const bits = rows ? rows[r] : (Math.random() * 32) | 0;
      for (let k = 0; k < GLYPH_W; k++)
        buf[r * TEX_W + c * GLYPH_W + k] = (bits >> (GLYPH_W - 1 - k)) & 1 ? 255 : 0;
    }
  }
  return buf;
}

/* ============ title pose over time ============ */
/* Hard cuts: each value holds until the next offset, so the tube jumps rather
   than fades. Offsets must be strictly increasing, so collisions get nudged. */
function cuts(points, dur){
  const sorted = points.slice().sort((a, b) => a[0] - b[0]);
  const out = [];
  let prev = -1;
  for (const p of sorted){
    let o = clamp(p[0], 0, 1);
    if (o <= prev) o = Math.min(1, prev + .004);
    if (o === prev) continue;                          // no room left, drop it
    prev = o;
    out.push({ t: o * dur, op: p[1], jx: p[2] || 0, jy: p[3] || 0, skew: p[4] || 0 });
  }
  const last = out[out.length - 1];
  if (last.t < dur) out.push({ t: dur, op: last.op, jx: last.jx, jy: last.jy, skew: last.skew });
  return out;
}

/* --- idle broken tube -------------------------------------------------------
   A short burst of stutters, then a long quiet stretch, then another burst. Each
   burst draws its own length, rhythm and dip depths. Driven by timers rather than
   animation finish events, so the loop cannot stall if an event is missed. */
let idleTimer = null, animToken = 0, pulse = null, pulseTimer = null;

function idlePose(op, jx, jy, skew){
  T.op = op; T.jx = jx; T.jy = jy; T.skew = skew;
}
function idleStop(){
  clearTimeout(idleTimer);
  idleTimer = null;
  idlePose(1, 0, 0, 0);
}
function idleStart(first){
  if (reduced) return;
  const token = ++animToken;
  // after a burst hands the tube back, come round again quickly enough that the
  // effect rotation (every 1.5-4.5s) does not continually postpone the flicker
  idleLater(token, first ? rnd(120, 420) : rnd(900, 2600));
}
function idleLater(token, delay){
  if (reduced || token !== animToken) return;
  idleTimer = setTimeout(() => {
    if (reduced || token !== animToken) return;
    idleBurst(token, 4 + (Math.random() * 6 | 0));
  }, delay);
}
function idleBurst(token, left){
  if (reduced || token !== animToken) return;
  // mostly a partial sag, occasionally a near-total dropout
  const jitter = Math.random() < .3;
  idlePose(
    (Math.random() < .65 ? rnd(.35, .7) : rnd(.05, .25)).toFixed(2),
    jitter ? rnd(-1.4, 1.4) : 0, 0, jitter ? clamp(Math.tan(rnd(-2, 2) * Math.PI / 180), -.04, .04) : 0);
  const hold = rnd(22, 100);                          // brief dropout...
  idleTimer = setTimeout(() => {
    if (reduced || token !== animToken) return;
    idlePose(1, 0, 0, 0);
    if (left > 1) idleTimer = setTimeout(() => idleBurst(token, left - 1), rnd(45, 200));  // ...then lit
    else idleLater(token, rnd(2000, 5200));           // quiet stretch
  }, hold);
}

/* A one-shot stutter takes the tube over, then hands it back to the idle loop. */
function pulseTitle(alert, build){
  if (reduced) return;
  const { frames, dur } = build();
  ++animToken;                                        // retire the running idle loop
  idleStop();
  clearTimeout(pulseTimer);
  pulse = { frames, dur, t0: performance.now(), alert };
  pulseTimer = setTimeout(() => {                     // driven by the clock, not onfinish
    pulse = null;
    T.red = 0;
    idleStart(false);
  }, dur + 30);
}

/* overload: red alert stutter, strength and rhythm redrawn each time */
function buildSurge(){
  const dur = rnd(800, 1500);
  const p = [[0, 1, 0, 0, 0]];
  let t = rnd(.03, .1);
  const n = 3 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.12, .55), rnd(-3.5, 3.5), rnd(-2, 2), rnd(-.18, .18)]);
    t += rnd(.04, .15);
    p.push([t, 1, rnd(-1, 1), 0, rnd(-.03, .03)]);
    t += rnd(.03, .13);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* blackout: cut out, sit dead a while, then stutter back on */
function buildCut(){
  const dur = rnd(1300, 2300);
  const dead = rnd(.28, .5);
  const p = [[0, 1, 0, 0, 0], [rnd(.015, .05), 0, 0, 0, 0], [dead, 0, 0, 0, 0]];
  let t = dead;
  const n = 3 + (Math.random() * 5 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.15, .9), rnd(-1.5, 1.5), 0, rnd(-.05, .05)]);
    p.push([t + rnd(.008, .03), 1, 0, 0, 0]);
    t += rnd(.015, .05);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* glitch: a couple of torn frames, thrown in random directions */
function buildTear(){
  const dur = rnd(300, 620);
  const p = [[0, 1, 0, 0, 0]];
  let t = rnd(.05, .16);
  const n = 2 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.2, .7), between(2, 6) * rnd(1.2, 2.4), 0, rnd(-.09, .09)]);
    t += rnd(.08, .2);
    p.push([t, 1, 0, 0, 0]);
    t += rnd(.08, .2);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* --- decrypt: dot columns resolve in a random order at a random pace --- */
let decoding = false, texDirty = false, shownChars = [];
function fxDecrypt(){
  if (decoding || reduced) return;
  decoding = true;
  const unit = rnd(38, 78);

  // shuffle the lock order, then stagger it
  const order = [...Array(NCHAR).keys()];
  for (let i = order.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [order[i], order[j]] = [order[j], order[i]];
  }
  const lockAt = new Array(NCHAR);
  order.forEach((idx, rank) => { lockAt[idx] = rank * unit + rnd(0, unit * .7); });
  const total = (NCHAR - 1) * unit + unit + 240;

  const t0 = performance.now();
  (function frame(){
    const e = performance.now() - t0;
    shownChars = [...WORD].map((ch, i) => e >= lockAt[i] ? ch : null);
    texDirty = true;                                  // garbage segments still unresolved
    if (e < total) requestAnimationFrame(frame);
    else { shownChars = [...WORD]; texDirty = true; decoding = false; }
  })();
}

/* --- bins: background envelope + title pose, drawn fresh each time --- */
function fxOverload(){
  FX.surge = { t0: performance.now(), dur: rnd(2400, 3900), ramp: rnd(80, 190),
               release: rnd(600, 1200), speed: rnd(3, 6) };
  pulseTitle(true, buildSurge);
}
function fxBlackout(){
  FX.blackout = { t0: performance.now(), dur: rnd(1400, 2400), cut: rnd(90, 200),
                  dead: rnd(400, 800), seg: rnd(45, 95), seed: rnd(0, 997) };
  pulseTitle(false, buildCut);
}
function fxGlitch(){
  FX.glitch = { t0: performance.now(), dur: rnd(280, 560), band: rnd(10, 26),
                rate: rnd(14, 30), mag: rnd(50, 130) };
  pulseTitle(false, buildTear);
}

const BINS = {
  decrypt:  { desc: 'decode the title',    run: fxDecrypt },
  overload: { desc: 'saturate the link',   run: fxOverload },
  blackout: { desc: 'cut the power',       run: fxBlackout },
  glitch:   { desc: 'tear one frame',      run: fxGlitch },
};

/* konami sequence → overload */
const SEQUENCE = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let seqIdx = 0;
addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === SEQUENCE[seqIdx]){
    if (++seqIdx === SEQUENCE.length){ seqIdx = 0; fxOverload(); }
  } else {
    seqIdx = (k === SEQUENCE[0]) ? 1 : 0;
  }
});

/* --- idle rotation: one random effect every few seconds, never while the tab is
       hidden, and never right after the user touches the page --------------- */
let rotTimer = null;
const ROTATION = ['decrypt', 'decrypt', 'overload', 'glitch', 'glitch', 'blackout'];

function scheduleRotation(){
  clearTimeout(rotTimer);
  rotTimer = setTimeout(() => {
    if (!document.hidden) BINS[ROTATION[(Math.random() * ROTATION.length) | 0]].run();
    scheduleRotation();
  }, 1500 + Math.random() * 3000);                    // 1.5–4.5s, stays under 5s after timer drift
}
if (!reduced){
  idleStart(true);                                    // opens with a warm-up stutter
  scheduleRotation();
  // any real interaction pushes the next effect out, so it never interrupts
  ['pointerdown', 'keydown'].forEach(ev =>
    addEventListener(ev, () => scheduleRotation(), { passive: true }));
}

/* ============ the controls: the browser console ============ */
/* The page has no UI of its own, so these functions plus the click and konami
   shortcuts are how the effects are fired. */
(function(){
  const tag  = 'background:#00e69c;color:#04150c;font:600 12px/1.7 monospace;padding:2px 6px;border-radius:3px';
  const name = 'color:#7fe8bd;font-family:monospace';
  const dim  = 'color:#1d7a54;font-family:monospace';
  const line = (s, style) => console.log('%c' + s, style || name);

  const api = {};
  Object.entries(BINS).forEach(([n, b]) => {
    api[n] = () => { b.run(); return n + ': ' + b.desc; };
  });
  api.help = () => {
    line('bins', dim);
    Object.entries(BINS).forEach(([n, b]) => console.log('%c  netns.' + n + '()  %c' + b.desc, name, dim));
    line('triggers', dim);
    console.log('%c  click the title  %cdecrypt', name, dim);
    console.log('%c  \u2191\u2191\u2193\u2193\u2190\u2192\u2190\u2192BA  %coverload', name, dim);
    line('a random bin also runs on its own every 1.5-4.5s', dim);
    return Object.keys(BINS);
  };
  window.netns = api;

  console.log('%c netns.dev ', tag);
  line(Object.keys(BINS).map(n => 'netns.' + n + '()').join(' · '));
  line('netns.help() for the guide and the triggers', dim);
})();

/* ============ WebGL renderer ============ */
(function(){
  /* World grid. The mask is a coastline-only raster of Natural Earth 110m land
     (public domain), 89 x 45 cells, cropped to 130°W–155°E and 85°N–60°S: the
     Pacific is dropped so the landmasses sit closer together and fill the frame.
     Both cut lines fall in open ocean, so no continent is sliced. Packed one bit
     per cell, row-major from the north-west. The grid the shader draws is anchored
     to this, so every dot is a place and the bold dots trace the coasts. */
  const MAP_COLS = 89, MAP_ROWS = 45;
  const MAP_MASK = 'AAAADwAAAAAAAAAAHv/4YAHAgAOAAAQJz4AQAQAAADAABgIgIAgAAAwH5gAAc34IOAAMAGwA///GccRgADnX1AAABgBow0DAKhQEAAADAEHAQABqAAAAAB+AEFgAAQyAAAAAEEAHQwABDYAAAAAQEABDAAB5AAAAAAYEAAJgACEGMAAAAgIAAYAAD2TkAAAGAQADAAAcbJoAADwAgAIAAAwF9QAAIiAgAwAAA+ERAAAJYAweAAACCRCAAAJAARAAAAIDeLAAAQAAUEAAAgAKJwADAAAYYAACAAKMQ4YAAA6CAACAAUQSJAAAAeAAAIAAXAYKEAAAGAAAQAAQAwaEAAAE+AAQgAYBAogAAACCAAewAQAAgQAAAEDAAAQBAADMAAAAQCAABAEAACYgAAAgDwABAQAAGUcAAAgAQABAgAADAOAABABAACBAAAAACAABAEAAECAAAAGAAABAIAAQNgAAAygAABAQAAQjAAACCgAACDAAAgmAAAYAgAAIIAABCAAAAgBAAAQQAABIAAAAnCAAAhAAADgAAABxEAABMAAAAAAAAAB4AACgAAAAAAAAAAAAAKAAAAAAAAAABAAAUAAAAAAAAAAAAAAoAAAAAAAAAAAAABgAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAA';

  /* Cables between the ports, in world cells (cell centres = col+0.5, row+0.5).
     Endpoints were snapped to the nearest coastline cell, and the bow of each arc
     was then chosen by searching for a value that keeps the whole route over open
     water — at this resolution a cable has to round a continent, not cut across
     it, so every route here was verified to clear every land cell along its path. */
  const MAP_LINKS = [
    [22.5, 37.5, 87.5, 36.5,   5.92],   // buenos aires – sydney
    [20.5, 12.5, 87.5, 36.5,  15.12],   // halifax      – sydney
    [17.5, 13.5, 46.5, 36.5,   0.00],   // new york     – cape town
    [22.5, 37.5, 65.5, 22.5,  11.06],   // buenos aires – chennai
    [18.5, 36.5,  0.5,  9.5,  -4.93],   // valparaiso   – honolulu
    [14.5, 22.5, 34.5,  6.5,  -0.78],   // panama       – reykjavik
    [52.5, 27.5, 77.5, 35.5,   1.59],   // mombasa      – perth
    [84.5, 14.5, 87.5, 29.5,  -0.93],   // tokyo        – auckland
    [35.5, 21.5, 34.5,  6.5,  -2.74],   // dakar        – reykjavik
    [14.5, 22.5, 28.5, 27.5,  -3.16],   // panama       – fortaleza
  ];

  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { alpha:false, antialias:false, powerPreference:'low-power' })
          || canvas.getContext('experimental-webgl');
  if (!gl){ showFallback(); return; }

  const VS = `
    attribute vec2 a_p;
    void main(){ gl_Position = vec4(a_p, 0., 1.); }
  `;
  const FS = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform vec2 u_res;
    uniform float u_time;    // real seconds — LED blink, decay
    uniform float u_flow;    // packet-travel clock; advances slowly under u_surge
    uniform float u_surge;   // 0..1 link saturation
    uniform float u_power;   // 1 = mains on, ~0 = blackout
    uniform float u_glitch;  // 0..1 torn-frame displacement
    uniform vec3  u_rand;    // per-load seed: lattice hash offset, blink rate
    uniform vec3  u_gl;      // per-run glitch shape: band height, reshuffle rate, throw
    uniform vec2  u_cell;    // title cell size (uv) and dot radius (device px)
    uniform vec2  u_t_jit;   // title jitter (uv)
    uniform vec3  u_t_pose;  // title opacity, skew slope, red tint
    uniform sampler2D u_tex; // dot-matrix title: one texel per dot
    uniform vec2  u_mcell;   // world-grid cell size (uv); the lattice is anchored to it
    uniform float u_dotr;    // dot radius in device px, shared with the title so the
                             // map dots can never outgrow the logo
    uniform vec2  u_morig;   // uv of the map's top-left corner (uv.y grows upward)
    uniform sampler2D u_map; // world mask: r = coastline, a = port (one texel per cell)
    uniform vec4  u_links[10];   // cable endpoints, in world cells
    uniform vec4  u_lparam[10];  // per cable: arc height, speed, phase, brightness

    float hash11(float n){ return fract(sin(n * 127.1) * 43758.5453123); }
    float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

    // crisp LED dot with an explicit radius, in device pixels
    float dotR(float dpx, float rad){ return 1. - smoothstep(rad - .9, rad + .9, dpx); }

    void main(){
      vec2 frag = gl_FragCoord.xy;
      // torn frame: shove whole scanline bands sideways; band height, reshuffle
      // rate and throw distance are redrawn for every glitch. Because the title
      // is sampled from this same displaced coordinate, it tears along with the
      // background instead of being animated separately.
      if (u_glitch > .001){
        float band = floor(frag.y / u_gl.x);
        frag.x += (hash11(band * 3.1 + floor(u_time * u_gl.y) * 7.3) - .5) * u_gl.z * u_glitch;
      }
      // lanes and the lattice are anchored to the world grid, so a cell is a
      // place on the map rather than a position on the screen
      vec2 uv  = (frag - .5 * u_res) / u_res.y;
      float pxsz = 1. / u_res.y;                      // one device pixel in uv units
      // #00e69c → alarm red; fully swapped at peak so the mix never goes olive
      vec3 green = mix(vec3(.0, .902, .612), vec3(1., .16, .09), u_surge);
      vec3 col = mix(vec3(.013, .055, .033), vec3(.055, .016, .013), u_surge);
      float boost = 1. + u_surge * 1.2;

      // cell coordinates: y grows downward, (0,0) is the map's top-left
      vec2 mg = vec2(uv.x - u_morig.x, u_morig.y - uv.y) / u_mcell.x;
      vec2 cid = floor(mg);
      float mapCellPx = u_mcell.x * u_res.y;
      float distPx = length(fract(mg) - .5) * mapCellPx;

      // ambient lattice, and land outlines that stay finer than the logo's dots
      float blink = step(.955, hash21(cid + floor(u_time * u_rand.z) * 1.7)) * .3;
      float amb = dotR(distPx, u_dotr * .5) * (.035 + .03 * hash21(cid * 1.7 + u_rand.x) + blink);

      // land outlines: a faint tracer on the coast, brighter where a port sits
      vec4 mp = texture2D(u_map, (cid + .5) / vec2(128., 64.));
      float inMap = step(-.5, cid.x) * step(cid.x, 88.5) * step(-.5, cid.y) * step(cid.y, 44.5);
      float coast = dotR(distPx, u_dotr * .78) * inMap;
      float port  = dotR(distPx, u_dotr * .95) * inMap;
      float pulse = .8 + .2 * sin(u_time * 1.6 + cid.x * .7 + cid.y * 1.3);
      col += green * (amb + (coast * mp.r * .34 + port * mp.a * .68 * pulse)) * boost;

      // ---- traffic between regions: fixed cables, one packet each ----
      float pk = 0.;
      for (int i = 0; i < 10; i++){
        vec4 L = u_links[i];
        vec4 P = u_lparam[i];
        vec2 a = L.xy, b = L.zw;
        vec2 ba = b - a;
        float len = length(ba);
        vec2 dir = ba / len;
        vec2 rel = mg - a;
        float along = dot(rel, dir);
        if (along > -2. && along < len + 2.){
          float tn = along / len;
          // the cable bows outwards, so long-haul routes read as arcs
          float arcOff = sin(clamp(tn, 0., 1.) * 3.14159265) * P.x;
          float dcPx = abs(dot(rel, vec2(-dir.y, dir.x)) - arcOff) * mapCellPx;
          float cable = (1. - smoothstep(.45, 1.5, dcPx)) * .085;
          float u = fract(u_flow * P.y + P.z);
          float back = (u - tn) * len;                // >0 once the head has passed
          float front = smoothstep(-.7, .7, back);    // nothing glows ahead of the head
          float comet = (exp(-max(back, 0.) * 1.4) * .85 + exp(-back * back * 1.1) * 2.4) * front;
          float prof = dotR(dcPx, 1.05) + exp(-dcPx * dcPx * .25) * .22;
          pk += (cable + comet * prof) * P.w;
        }
      }
      col += green * pk * boost;

      // ---- dot-matrix title ----
      float cellPx = u_cell.x * u_res.y;
      float tOp = u_t_pose.x;
      if (tOp > .002){
        vec2 lc = (uv - u_t_jit) / u_cell.x;            // title-local, in cell units
        lc.x += lc.y * u_t_pose.y;                      // skew
        vec2 bd = abs(lc) - vec2(53., 5.) * .5;
        col *= 1. - .38 * tOp * (1. - smoothstep(0., 5., max(bd.x, bd.y)));

        vec2 g = lc + vec2(53., 5.) * .5;               // 0..COLS / 0..ROWS
        float gi = floor(g.x), gj = floor(g.y);
        float ch  = floor(gi / 6.);                     // char index (5 wide + 1 gap)
        float col5 = gi - ch * 6.;
        float gRow = 4. - gj;                           // glyph rows run top-down
        float inside = step(0., gi) * step(gi, 52.5) * step(0., gj) * step(gj, 4.5)
                     * step(col5, 4.5) * step(ch, 8.5);
        float dc = ch * 5. + col5;                      // dot column in the texture
        float on = step(.5, texture2D(u_tex, vec2((dc + .5) / 64., (gRow + .5) / 8.)).r) * inside;

        vec2 d = fract(g) - .5;                         // offset from the dot centre
        float distPx = length(d) * cellPx;
        float core = 1. - smoothstep(u_cell.y - .8, u_cell.y + .8, distPx);
        float glow = exp(-distPx * distPx / (2. * (cellPx * .95) * (cellPx * .95)));
        // "netns" reads brighter than the ".dev" suffix, as in the text version
        vec3 tcol = mix(vec3(.918, 1., .961), vec3(0., .902, .612), step(4.5, ch));
        tcol = mix(tcol, vec3(1., .16, .09), u_t_pose.z);
        col += tcol * (core + glow * .5) * on * tOp;
      }

      // vignette + fine grain
      float r = length(uv);
      col *= 1. - r * .5;
      col += (hash21(frag + fract(u_time)) * 2. - 1.) * .006;

      col *= u_power;                                 // mains switch
      gl_FragColor = vec4(col, 1.);
    }
  `;

  function shader(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
  } catch (err){
    console.error('netns shader failed, falling back to plain title:', err);
    showFallback();
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();                      // fullscreen triangle
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'a_p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uTime  = gl.getUniformLocation(prog, 'u_time');
  const uFlow  = gl.getUniformLocation(prog, 'u_flow');
  const uSurge = gl.getUniformLocation(prog, 'u_surge');
  const uPower = gl.getUniformLocation(prog, 'u_power');
  const uGlitch= gl.getUniformLocation(prog, 'u_glitch');
  const uRand  = gl.getUniformLocation(prog, 'u_rand');
  const uGl    = gl.getUniformLocation(prog, 'u_gl');
  const uCell  = gl.getUniformLocation(prog, 'u_cell');
  const uTJit  = gl.getUniformLocation(prog, 'u_t_jit');
  const uTPose = gl.getUniformLocation(prog, 'u_t_pose');
  const uTex   = gl.getUniformLocation(prog, 'u_tex');
  const uMCell = gl.getUniformLocation(prog, 'u_mcell');
  const uDotR  = gl.getUniformLocation(prog, 'u_dotr');
  const uMOrig = gl.getUniformLocation(prog, 'u_morig');
  const uMap   = gl.getUniformLocation(prog, 'u_map');
  const uLinks = gl.getUniformLocation(prog, 'u_links[0]');
  const uLParam= gl.getUniformLocation(prog, 'u_lparam[0]');

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

  /* ---- title texture (unit 0): one texel per title dot ---- */
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(uTex, 0);

  shownChars = [...WORD];
  function markTitleDirty(){ texDirty = true; }
  markTitleDirty();

  /* ---- world texture (unit 1): coastline mask + port marks ---- */
  const MAP_TW = 128, MAP_TH = 64;
  const mapTex = gl.createTexture();
  const mapData = new Uint8Array(MAP_TW * MAP_TH * 2);   // LUMINANCE_ALPHA pairs
  {
    const bin = atob(MAP_MASK);
    // the texture is 128 wide while the mask rows are 112 bits, so each row is
    // written at its own stride — packing them end to end would shear the map
    for (let row = 0; row < MAP_ROWS; row++){
      for (let col = 0; col < MAP_COLS; col++){
        const i = row * MAP_COLS + col;
        if ((bin.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1)
          mapData[(row * MAP_TW + col) * 2] = 255;
      }
    }
    for (const [ax, ay, bx, by] of MAP_LINKS){
      for (const [x, y] of [[ax, ay], [bx, by]]){
        const i = (Math.floor(y) * MAP_TW + Math.floor(x)) * 2 + 1;  // endpoints are cell centres
        mapData[i] = 255;
      }
    }
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, mapTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE_ALPHA, MAP_TW, MAP_TH, 0,
                gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, mapData);
  gl.uniform1i(uMap, 1);

  /* ---- cable geometry: endpoints plus a per-cable arc, speed and phase ---- */
  const linkData = new Float32Array(MAP_LINKS.length * 4);
  const paramData = new Float32Array(MAP_LINKS.length * 4);
  MAP_LINKS.forEach(([ax, ay, bx, by, bow], i) => {
    linkData.set([ax, ay, bx, by], i * 4);
    paramData.set([
      bow,                                            // precomputed water-clearing arc
      rnd(.15, .3),                                   // packet speed (cycles per second)
      Math.random(),                                  // phase along the cable
      rnd(.55, 1),                                    // brightness
    ], i * 4);
  });
  gl.uniform4fv(uLinks, linkData);
  gl.uniform4fv(uLParam, paramData);

  // per-load seed: lattice hash offset / (unused) / blink rate
  gl.uniform3f(uRand, Math.random(), 0, rnd(.45, 1.6));
  gl.uniform3f(uGl, 18, 22, 90);                      // overwritten on each glitch

  let cellCss = 9, resY = 0;
  function metrics(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    resY = canvas.height;

    // The world grid always fits the viewport, so the map keeps its 112:45
    // proportions instead of being squashed by the screen's aspect ratio.
    const scale   = Math.min(innerWidth / MAP_COLS, innerHeight / MAP_ROWS) * .86;
    const cellPxY = scale * dpr;
    const cellUv  = cellPxY / resY;
    const wUv = MAP_COLS * cellUv, hUv = MAP_ROWS * cellUv;
    gl.uniform2f(uMCell, cellUv, cellUv);
    gl.uniform2f(uMOrig, -.5 * wUv, .5 * hUv);           // uv.y grows upward

    // title: shrink the 53-col block to fit narrow screens. Its dot radius is
    // published as u_dotr and reused as the ceiling for every map dot.
    cellCss = clamp(innerWidth * .38 / COLS, 4, 6.5);
    const dotPx = cellCss * dpr * .30;
    gl.uniform1f(uDotR, dotPx);
    gl.uniform2f(uCell, cellCss * dpr / resY, dotPx);
    return dpr;
  }
  let dpr = 1;
  function resize(){ dpr = metrics(); }
  resize();
  addEventListener('resize', resize);

  /* The canvas is behind the page, so the title needs its own pointer handling. */
  function titleHit(x, y){
    const w = COLS * cellCss, h = ROWS * cellCss;
    const x0 = (innerWidth - w) / 2, y0 = (innerHeight - h) / 2;
    return x >= x0 - 8 && x <= x0 + w + 8 && y >= y0 - 8 && y <= y0 + h + 8;
  }
  addEventListener('pointermove', (e) => {
    document.body.style.cursor = titleHit(e.clientX, e.clientY) ? 'pointer' : '';
  }, { passive: true });
  addEventListener('click', (e) => {
    if (titleHit(e.clientX, e.clientY)) fxDecrypt();
  });

  const t0 = performance.now();
  let flow = 0, last = t0;

  function frame(now){
    const dt = Math.min((now - last) / 1000, .1);
    last = now;

    // each envelope reads the shape its bin drew when it fired
    let surge = 0;
    const S = FX.surge;
    if (S){
      const e = now - S.t0;
      if (e >= 0 && e < S.dur)
        surge = Math.min(e / S.ramp, 1) * Math.min(1, Math.max(0, (S.dur - e) / S.release));
      else FX.surge = null;
    }

    let power = 1;
    const B = FX.blackout;
    if (B){
      const e = now - B.t0;
      if (e >= 0 && e < B.dur){
        if (e < B.cut) power = 1 - e / B.cut;
        else if (e < B.cut + B.dead) power = .015;
        else {
          const seg = Math.floor((e - B.cut - B.dead) / B.seg);
          const r = Math.abs(Math.sin(seg * 12.9898 + B.seed) * 43758.5453) % 1;
          power = r < .45 ? .02 : (.35 + r * .65);
        }
      } else FX.blackout = null;
    }

    let glitch = 0;
    const G = FX.glitch;
    if (G){
      const e = now - G.t0;
      if (e >= 0 && e < G.dur){
        glitch = (Math.floor(e / (G.dur / 4)) % 2 === 0 ? 1 : .3) * (1 - e / G.dur);
        gl.uniform3f(uGl, G.band, G.rate, G.mag);
      } else FX.glitch = null;
    }

    // one-shot title stutter takes over the pose; otherwise the idle loop owns it
    if (pulse){
      const e = now - pulse.t0;
      const f = pulse.frames;
      if (e >= 0 && e < pulse.dur){
        let i = 0;
        while (i < f.length - 1 && f[i + 1].t <= e) i++;
        T.op = f[i].op; T.jx = f[i].jx; T.jy = f[i].jy; T.skew = f[i].skew;
        T.red = pulse.alert ? 1 : 0;
      }
    }

    if (texDirty){
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TEX_W, TEX_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE,
                    dotTexture(shownChars));
      texDirty = false;
    }

    // Links congest under load, so the healthy state runs fast and the red alert
    // throttles traffic to a crawl. Accumulated separately from u_time so the
    // packet phase stays continuous — the slowdown is a rate change, not a jump.
    flow += dt * (1 - .82 * surge);
    gl.uniform1f(uTime,  (now - t0) / 1000);
    gl.uniform1f(uFlow,  flow);
    gl.uniform1f(uSurge, surge);
    gl.uniform1f(uPower, power);
    gl.uniform1f(uGlitch, glitch);
    gl.uniform2f(uTJit, T.jx * dpr / resY, T.jy * dpr / resY);
    gl.uniform3f(uTPose, T.op, T.skew, T.red);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  if (reduced){                                       // one static frame, no effects
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TEX_W, TEX_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE,
                  dotTexture([...WORD]));
    gl.uniform1f(uTime, 0);
    gl.uniform1f(uFlow, 0);
    gl.uniform1f(uSurge, 0);
    gl.uniform1f(uPower, 1);
    gl.uniform1f(uGlitch, 0);
    gl.uniform2f(uTJit, 0, 0);
    gl.uniform3f(uTPose, 1, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return;
  }

  let raf = requestAnimationFrame(function loop(now){
    frame(now);
    raf = requestAnimationFrame(loop);
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      cancelAnimationFrame(raf);
    } else {
      last = performance.now();
      raf = requestAnimationFrame(function loop(now){
        frame(now);
        raf = requestAnimationFrame(loop);
      });
    }
  });
})();

/* Reveal the plain DOM heading when the shader cannot run, so the page still
   shows its name (background effects keep working where they can). */
function showFallback(){
  const t = document.getElementById('title');
  t.classList.add('fallback');
  t.addEventListener('click', fxDecrypt);
}
</script>
</body>
</html>
