<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>netns.dev</title>
<meta name="description" content="netns.dev">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#04150c">
<style>
  *{ margin:0; box-sizing:border-box; }
  body{
    background:#04150c;
    background-image:radial-gradient(560px 380px at 50% 50%, rgba(0,230,156,.08), transparent 70%);
    color:#00e69c;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100vh;
    display:grid; place-items:center;
    padding:24px;
  }
  h1{
    font-size:2rem; font-weight:600; letter-spacing:.02em;
    color:#eafff5;
    text-shadow:
      0 0 8px rgba(0,230,156,.85),
      0 0 24px rgba(0,230,156,.55),
      0 0 60px rgba(0,230,156,.4);
    animation:flicker 7.3s steps(1,end) infinite;
  }
  h1 span{ color:#00e69c; text-shadow:inherit; }
  /* broken neon: harsh stutter, then steady; small glitches recur each cycle */
  @keyframes flicker{
    0%,10%,54%,58%,84%,100%{ opacity:1; }
    1%    { opacity:.15; }
    2%    { opacity:1; }
    4%    { opacity:.3; }
    5%    { opacity:1; }
    6.5%  { opacity:.55; }
    8%    { opacity:.2; }
    9%    { opacity:1; }
    55%   { opacity:.22; }
    56%   { opacity:1; }
    57%   { opacity:.5; }
    83%   { opacity:.35; }
  }
  @media (prefers-reduced-motion: reduce){
    h1{ animation:none; }
  }
</style>
</head>
<body>
  <h1>netns<span>.dev</span></h1>
</body>
</html>
