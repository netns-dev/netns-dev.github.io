<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>netns.dev</title>
<meta name="description" content="netns.dev">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#04150c">
<style>
  *{ margin:0; box-sizing:border-box; }
  body{
    background:#04150c;
    /* shows through the canvas when WebGL is unavailable or the shader fails */
    background-image:radial-gradient(620px 420px at 50% 50%, rgba(0,230,156,.10), transparent 72%);
    color:#00e69c;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100vh;
    display:grid; place-items:center;
    padding:24px;
  }
  canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  /* The dot-matrix title is drawn by the shader along with the background, so this
     heading is kept out of the way: it still names the page for search engines and
     screen readers, and .fallback turns it back into the visible title if WebGL
     cannot start (in which case effects run on the background only). */
  #title{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip-path:inset(50%); white-space:nowrap; border:0; padding:0;
  }
  #title.fallback{
    position:static; width:auto; height:auto; overflow:visible; clip-path:none;
    font-size:2rem; font-weight:600; letter-spacing:.02em;
    color:#eafff5; cursor:pointer; user-select:none;
    text-shadow:0 0 8px rgba(0,230,156,.85), 0 0 24px rgba(0,230,156,.55), 0 0 60px rgba(0,230,156,.4);
  }
  #title.fallback span{ text-shadow:inherit; }
  #title.fallback span:last-child{ color:#00e69c; }

  /* no double-tap-zoom delay, so the title reads a double-tap promptly */
  html{ touch-action:manipulation; }
  /* Breakout extra: the whole viewport becomes the field, so while a round is on
     there is nothing to scroll, nothing to pinch, and no cursor to show. */
  html.playing, html.playing body{
    touch-action:none; overscroll-behavior:none; cursor:none; user-select:none;
  }

</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <h1 id="title"><span>netns</span><span>.dev</span></h1>

  <!-- The page has no controls of its own. The effects are driven from the
       browser console (see netns.help), from a click on the title, and from the
       konami code. -->

<script>
/* ============ state shared with the renderer ============ */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rnd = (a, b) => a + Math.random() * (b - a);
const between = (a, b) => Math.random() < .5 ? -1 : 1;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* Per-run envelopes for the background, and the title's own pose. The renderer
   reads both every frame; the bins write them. Every activation redraws its
   durations, jolt counts and rhythm, so no two runs look alike. */
const FX = { surge: null, blackout: null, glitch: null };
const T  = { op: 1, jx: 0, jy: 0, skew: 0, red: 0 };

/* ============ 8-bit sound ============ */
/* Square-wave blips, synthesised on the spot: the page ships no audio files, and a
   square wave is the entire palette an 8-bit machine had to work with anyway. The
   context may only start from a user gesture, and every way into the extra is one —
   a double-tap on the title. Started from the console there is no gesture, so the
   context stays suspended until the next click; see the resume listener below. */
const SFX = { on: true, ctx: null, gain: null, lastHit: 0 };

function sfxInit(){
  if (!SFX.on) return null;
  if (!SFX.ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ SFX.on = false; return null; }
    SFX.ctx = new AC();
    SFX.gain = SFX.ctx.createGain();
    SFX.gain.gain.value = .07;
    SFX.gain.connect(SFX.ctx.destination);
  }
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume().catch(() => {});
  return SFX.ctx;
}

/* One square note. Bending the pitch across the note is where most of the
   character comes from — a falling pitch reads as failure, a rising one as reward. */
function sfxNote(at, freq, dur, vol, to){
  const ctx = SFX.ctx;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, at);
  if (to) o.frequency.linearRampToValueAtTime(to, at + dur);
  g.gain.setValueAtTime(.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + .005);
  g.gain.setValueAtTime(vol, at + dur * .7);
  g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(g); g.connect(SFX.gain);
  o.start(at); o.stop(at + dur + .02);
}

/* notes are [offset, frequency, duration, volume, bend-to] */
function sfx(notes){
  if (!SFX.on || !sfxInit()) return;
  const t = SFX.ctx.currentTime;
  for (const n of notes) sfxNote(t + n[0], n[1], n[2], n[3], n[4]);
}

/* a rising three-note "ready" */
const sfxStart = () => sfx([[0, 392, .085, .85], [.075, 523, .085, .85], [.15, 784, .22, .9]]);
/* a short blip that climbs as the wall wears down; throttled so a burst of bricks
   reads as a run of hits rather than one buzz */
function sfxHit(row){
  const now = performance.now();
  if (now - SFX.lastHit < 28) return;
  SFX.lastHit = now;
  const f = [880, 760, 640, 540, 452][clamp(row, 0, ROWS - 1)] * rnd(.98, 1.02);
  sfx([[0, f, .05, .5, f * .82]]);
}
/* a descending slide, the classic Game Over fall */
const sfxLose = () => sfx([[0, 440, .1, .8], [.1, 349, .1, .8], [.2, 262, .12, .8], [.33, 196, .34, .85, 110]]);
/* an ascending fanfare, held on the top note */
const sfxWin = () => sfx([[0, 523, .1, .85], [.09, 659, .1, .85], [.18, 784, .1, .85],
                          [.27, 1047, .13, .9], [.41, 1319, .32, .9], [.76, 1568, .26, .7]]);
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => {
  if (SFX.on && SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume().catch(() => {});
}, { passive: true }));

/* ============ hidden extra: breakout ============ */
/* Double-tapping the wordmark turns its own dots into a brick wall and drops a
   paddle at the bottom of the screen. The state lives out here because the idle
   rotation, the konami trigger and the title's decrypt all have to stand down
   while a round is on; the renderer owns the physics and the drawing. Geometry is
   held in arena-local CSS pixels — the origin is the arena's top-left corner, not
   the viewport's — so the physics never has to know where the cabinet sits. */
const BRK = {
  on: false,
  dots: null,          // COLS*ROWS: 1 = that dot is still standing
  bricks: [],          // runs of lit dots, each with a live flag and a rectangle
  alive: 0,            // bricks still standing
  run: null,           // installed by the renderer; see netns.breakout()
  W: 0, H: 0,          // arena size (the playfield, not the viewport)
  ax: 0, ay: 0,        // arena's top-left corner in screen CSS px
  cell: 0,             // wall cell size — the wordmark's own cell, unmagnified
  wallT: 0, wallL: 0,  // wall's top-left corner in arena-local px
  jy: 0,               // wordmark centre in uv, so it sits on the arena's top edge
  pad: { x: 0, y: 0, hw: 0, hh: 0, target: 0 },
  ball: { x: 0, y: 0, vx: 0, vy: 0, r: 0 },
  ballR: 0,            // radius at the current field size
  keys: { l: false, r: false },
  base: 0, speed: 0,   // ball speed now, and at the start of a life
  hold: 0,             // seconds left before the ball is served
  acc: 0,
  win: false, winT: 0, revealed: 0,   // cleared: the wordmark writes itself back on
  lose: false, loseT: 0,              // ball lost: the field goes red, then it returns
};

/* ============ dot-matrix title ============ */
/* 5x5 glyph bitmaps, one bit per column (MSB = leftmost), same grid as favicon.svg */
const FONT = {
  'N': [0b10001, 0b11001, 0b10101, 0b10011, 0b10001],
  'E': [0b11111, 0b10000, 0b11110, 0b10000, 0b11111],
  'T': [0b11111, 0b00100, 0b00100, 0b00100, 0b00100],
  'S': [0b01111, 0b10000, 0b01110, 0b00001, 0b11110],
  'D': [0b11110, 0b10001, 0b10001, 0b10001, 0b11110],
  'V': [0b10001, 0b10001, 0b10101, 0b01010, 0b00100],
  '.': [0b00000, 0b00000, 0b00000, 0b00110, 0b00110],
  /* Only used by the breakout extra's error screen — the wordmark itself never
     needs them, and dotTexture() only ever walks the first WORD.length chars. */
  'O': [0b01110, 0b10001, 0b10001, 0b10001, 0b01110],
  'R': [0b11110, 0b10001, 0b11110, 0b10100, 0b10010],
};
const WORD  = 'NETNS.DEV';
const NCHAR = WORD.length;                             // 9
const GLYPH_W = 5, GLYPH_GAP = 1;
const COLS = NCHAR * (GLYPH_W + GLYPH_GAP) - GLYPH_GAP; // 53 dot columns
const ROWS = 5;
const TEX_W = 64, TEX_H = 8;                           // power-of-two, mostly empty

/* One texel per dot, x = char*5 + column, y = row. Passing null for a character
   paints garbage segments, which is what the decrypt effect scrambles through. */
function dotTexture(shown){
  const buf = new Uint8Array(TEX_W * TEX_H);
  for (let c = 0; c < NCHAR; c++){
    const rows = shown[c] ? FONT[shown[c]] : null;
    for (let r = 0; r < ROWS; r++){
      const bits = rows ? rows[r] : (Math.random() * 32) | 0;
      for (let k = 0; k < GLYPH_W; k++)
        buf[r * TEX_W + c * GLYPH_W + k] = (bits >> (GLYPH_W - 1 - k)) & 1 ? 255 : 0;
    }
  }
  return buf;
}

/* ============ title pose over time ============ */
/* Hard cuts: each value holds until the next offset, so the tube jumps rather
   than fades. Offsets must be strictly increasing, so collisions get nudged. */
function cuts(points, dur){
  const sorted = points.slice().sort((a, b) => a[0] - b[0]);
  const out = [];
  let prev = -1;
  for (const p of sorted){
    let o = clamp(p[0], 0, 1);
    if (o <= prev) o = Math.min(1, prev + .004);
    if (o === prev) continue;                          // no room left, drop it
    prev = o;
    out.push({ t: o * dur, op: p[1], jx: p[2] || 0, jy: p[3] || 0, skew: p[4] || 0 });
  }
  const last = out[out.length - 1];
  if (last.t < dur) out.push({ t: dur, op: last.op, jx: last.jx, jy: last.jy, skew: last.skew });
  return out;
}

/* --- idle broken tube -------------------------------------------------------
   A short burst of stutters, then a long quiet stretch, then another burst. Each
   burst draws its own length, rhythm and dip depths. Driven by timers rather than
   animation finish events, so the loop cannot stall if an event is missed. */
let idleTimer = null, animToken = 0, pulse = null, pulseTimer = null;

function idlePose(op, jx, jy, skew){
  T.op = op; T.jx = jx; T.jy = jy; T.skew = skew;
}
function idleStop(){
  clearTimeout(idleTimer);
  idleTimer = null;
  idlePose(1, 0, 0, 0);
}
function idleStart(first){
  if (reduced) return;
  const token = ++animToken;
  // after a burst hands the tube back, come round again quickly enough that the
  // effect rotation (every 1.5-4.5s) does not continually postpone the flicker
  idleLater(token, first ? rnd(120, 420) : rnd(900, 2600));
}
function idleLater(token, delay){
  if (reduced || token !== animToken) return;
  idleTimer = setTimeout(() => {
    if (reduced || token !== animToken) return;
    idleBurst(token, 4 + (Math.random() * 6 | 0));
  }, delay);
}
function idleBurst(token, left){
  if (reduced || token !== animToken) return;
  // mostly a partial sag, occasionally a near-total dropout
  const jitter = Math.random() < .3;
  idlePose(
    (Math.random() < .65 ? rnd(.35, .7) : rnd(.05, .25)).toFixed(2),
    jitter ? rnd(-1.4, 1.4) : 0, 0, jitter ? clamp(Math.tan(rnd(-2, 2) * Math.PI / 180), -.04, .04) : 0);
  const hold = rnd(22, 100);                          // brief dropout...
  idleTimer = setTimeout(() => {
    if (reduced || token !== animToken) return;
    idlePose(1, 0, 0, 0);
    if (left > 1) idleTimer = setTimeout(() => idleBurst(token, left - 1), rnd(45, 200));  // ...then lit
    else idleLater(token, rnd(2000, 5200));           // quiet stretch
  }, hold);
}

/* A one-shot stutter takes the tube over, then hands it back to the idle loop. */
function pulseTitle(alert, build){
  if (reduced) return;
  const { frames, dur } = build();
  ++animToken;                                        // retire the running idle loop
  idleStop();
  clearTimeout(pulseTimer);
  pulse = { frames, dur, t0: performance.now(), alert };
  pulseTimer = setTimeout(() => {                     // driven by the clock, not onfinish
    pulse = null;
    T.red = 0;
    idleStart(false);
  }, dur + 30);
}

/* overload: red alert stutter, strength and rhythm redrawn each time */
function buildSurge(){
  const dur = rnd(800, 1500);
  const p = [[0, 1, 0, 0, 0]];
  let t = rnd(.03, .1);
  const n = 3 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.12, .55), rnd(-3.5, 3.5), rnd(-2, 2), rnd(-.18, .18)]);
    t += rnd(.04, .15);
    p.push([t, 1, rnd(-1, 1), 0, rnd(-.03, .03)]);
    t += rnd(.03, .13);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* blackout: cut out, sit dead a while, then stutter back on */
function buildCut(){
  const dur = rnd(1300, 2300);
  const dead = rnd(.28, .5);
  const p = [[0, 1, 0, 0, 0], [rnd(.015, .05), 0, 0, 0, 0], [dead, 0, 0, 0, 0]];
  let t = dead;
  const n = 3 + (Math.random() * 5 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.15, .9), rnd(-1.5, 1.5), 0, rnd(-.05, .05)]);
    p.push([t + rnd(.008, .03), 1, 0, 0, 0]);
    t += rnd(.015, .05);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* glitch: a couple of torn frames, thrown in random directions */
function buildTear(){
  const dur = rnd(300, 620);
  const p = [[0, 1, 0, 0, 0]];
  let t = rnd(.05, .16);
  const n = 2 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++){
    p.push([t, rnd(.2, .7), between(2, 6) * rnd(1.2, 2.4), 0, rnd(-.09, .09)]);
    t += rnd(.08, .2);
    p.push([t, 1, 0, 0, 0]);
    t += rnd(.08, .2);
  }
  p.push([1, 1, 0, 0, 0]);
  return { frames: cuts(p, dur), dur };
}

/* --- decrypt: dot columns resolve in a random order at a random pace --- */
let decoding = false, texDirty = false, shownChars = [];
function fxDecrypt(){
  if (decoding || reduced) return;
  decoding = true;
  const unit = rnd(38, 78);

  // shuffle the lock order, then stagger it
  const order = [...Array(NCHAR).keys()];
  for (let i = order.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [order[i], order[j]] = [order[j], order[i]];
  }
  const lockAt = new Array(NCHAR);
  order.forEach((idx, rank) => { lockAt[idx] = rank * unit + rnd(0, unit * .7); });
  const total = (NCHAR - 1) * unit + unit + 240;

  const t0 = performance.now();
  (function frame(){
    // a round can start mid-decrypt; drop the scrambling and let the real word
    // come back rather than keep fighting the wall for the same texture
    if (BRK.on){ shownChars = [...WORD]; texDirty = true; decoding = false; return; }
    const e = performance.now() - t0;
    shownChars = [...WORD].map((ch, i) => e >= lockAt[i] ? ch : null);
    texDirty = true;                                  // garbage segments still unresolved
    if (e < total) requestAnimationFrame(frame);
    else { shownChars = [...WORD]; texDirty = true; decoding = false; }
  })();
}

/* --- bins: background envelope + title pose, drawn fresh each time --- */
function fxOverload(){
  FX.surge = { t0: performance.now(), dur: rnd(2400, 3900), ramp: rnd(80, 190),
               release: rnd(600, 1200), speed: rnd(3, 6) };
  pulseTitle(true, buildSurge);
}
function fxBlackout(){
  FX.blackout = { t0: performance.now(), dur: rnd(1400, 2400), cut: rnd(90, 200),
                  dead: rnd(400, 800), seg: rnd(45, 95), seed: rnd(0, 997) };
  pulseTitle(false, buildCut);
}
function fxGlitch(){
  FX.glitch = { t0: performance.now(), dur: rnd(280, 560), band: rnd(10, 26),
                rate: rnd(14, 30), mag: rnd(50, 130) };
  pulseTitle(false, buildTear);
}

const BINS = {
  decrypt:  { desc: 'decode the title',    run: fxDecrypt },
  overload: { desc: 'saturate the link',   run: fxOverload },
  blackout: { desc: 'cut the power',       run: fxBlackout },
  glitch:   { desc: 'tear one frame',      run: fxGlitch },
};

/* konami sequence → overload */
const SEQUENCE = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let seqIdx = 0;
addEventListener('keydown', (e) => {
  if (BRK.on) return;                                 // arrows drive the paddle
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === SEQUENCE[seqIdx]){
    if (++seqIdx === SEQUENCE.length){ seqIdx = 0; fxOverload(); }
  } else {
    seqIdx = (k === SEQUENCE[0]) ? 1 : 0;
  }
});

/* --- idle rotation: one random effect every few seconds, never while the tab is
       hidden, and never right after the user touches the page --------------- */
let rotTimer = null;
const ROTATION = ['decrypt', 'decrypt', 'overload', 'glitch', 'glitch', 'blackout'];

function scheduleRotation(){
  clearTimeout(rotTimer);
  rotTimer = setTimeout(() => {
    if (!document.hidden && !BRK.on) BINS[ROTATION[(Math.random() * ROTATION.length) | 0]].run();
    scheduleRotation();
  }, 1500 + Math.random() * 3000);                    // 1.5–4.5s, stays under 5s after timer drift
}
if (!reduced){
  idleStart(true);                                    // opens with a warm-up stutter
  scheduleRotation();
  // any real interaction pushes the next effect out, so it never interrupts
  ['pointerdown', 'keydown'].forEach(ev =>
    addEventListener(ev, () => { if (!BRK.on) scheduleRotation(); }, { passive: true }));
}

/* --- handing the screen to the breakout extra, and taking it back -------------
   Standing down is more than clearing one value: the rotation has to stop
   rescheduling, the idle loop has to be retired, and pulseTimer has to be cleared
   explicitly because its callback is unconditional — left alone it would restart
   the idle loop in the middle of a round and fight the game for the title pose.
   A decrypt already in flight notices BRK.on on its own. */
function fxSuspend(){
  ++animToken;
  clearTimeout(idleTimer);  idleTimer = null;
  clearTimeout(rotTimer);   rotTimer = null;
  clearTimeout(pulseTimer); pulseTimer = null;
  pulse = null;
  decoding = false;
  shownChars = [...WORD];
  texDirty = true;
  FX.surge = FX.blackout = FX.glitch = null;
  idlePose(1, 0, 0, 0);
  T.red = 0;
}
function fxResume(){
  if (reduced) return;
  // Losing ends on the red overload, and a running pulse hands the tube back to the
  // idle loop itself when its own timer expires. Starting one here as well would
  // leave the idle stutter and the alert fighting over the same pose.
  if (!pulse) idleStart(false);
  scheduleRotation();
}

/* ============ the controls: the browser console ============ */
/* The page has no UI of its own, so these functions plus the click and konami
   shortcuts are how the effects are fired. */
(function(){
  const tag  = 'background:#00e69c;color:#04150c;font:600 12px/1.7 monospace;padding:2px 6px;border-radius:3px';
  const name = 'color:#7fe8bd;font-family:monospace';
  const dim  = 'color:#1d7a54;font-family:monospace';
  const line = (s, style) => console.log('%c' + s, style || name);

  const api = {};
  Object.entries(BINS).forEach(([n, b]) => {
    api[n] = () => { b.run(); return n + ': ' + b.desc; };
  });
  api.breakout = () => {
    if (!BRK.run) return 'breakout: unavailable without WebGL or with reduced motion';
    if (BRK.on){ BRK.run.end(); return 'breakout: quit'; }
    BRK.run.start();
    return 'breakout: arrows or A/D, or drag — Esc to quit';
  };
  api.sound = (on) => {
    SFX.on = on === undefined ? !SFX.on : !!on;
    if (!SFX.on && SFX.ctx) SFX.ctx.suspend().catch(() => {});
    if (SFX.on) sfxInit();
    return 'sound: ' + (SFX.on ? 'on' : 'off');
  };
  api.help = () => {
    line('bins', dim);
    Object.entries(BINS).forEach(([n, b]) => console.log('%c  netns.' + n + '()  %c' + b.desc, name, dim));
    line('triggers', dim);
    console.log('%c  click the title  %cdecrypt', name, dim);
    console.log('%c  \u2191\u2191\u2193\u2193\u2190\u2192\u2190\u2192BA  %coverload', name, dim);
    console.log('%c  double-click the title  %cbreakout   (netns.breakout() toggles it)', name, dim);
    console.log('%c  netns.sound()  %cmute or unmute the breakout blips', name, dim);
    line('a random bin also runs on its own every 1.5-4.5s', dim);
    return Object.keys(BINS).concat('breakout', 'sound');
  };
  window.netns = api;

  console.log('%c netns.dev ', tag);
  line(Object.keys(BINS).map(n => 'netns.' + n + '()').join(' · '));
  line('netns.help() for the guide and the triggers', dim);
})();

/* ============ WebGL renderer ============ */
(function(){
  /* World grid. The mask is a coastline-only raster of Natural Earth 110m land
     (public domain), 89 x 45 cells, cropped to 130°W–155°E and 85°N–60°S: the
     Pacific is dropped so the landmasses sit closer together and fill the frame.
     Both cut lines fall in open ocean, so no continent is sliced. Packed one bit
     per cell, row-major from the north-west. The grid the shader draws is anchored
     to this, so every dot is a place and the bold dots trace the coasts. */
  const MAP_COLS = 89, MAP_ROWS = 45;
  const MAP_MASK = 'AAAADwAAAAAAAAAAHv/4YAHAgAOAAAQJz4AQAQAAADAABgIgIAgAAAwH5gAAc34IOAAMAGwA///GccRgADnX1AAABgBow0DAKhQEAAADAEHAQABqAAAAAB+AEFgAAQyAAAAAEEAHQwABDYAAAAAQEABDAAB5AAAAAAYEAAJgACEGMAAAAgIAAYAAD2TkAAAGAQADAAAcbJoAADwAgAIAAAwF9QAAIiAgAwAAA+ERAAAJYAweAAACCRCAAAJAARAAAAIDeLAAAQAAUEAAAgAKJwADAAAYYAACAAKMQ4YAAA6CAACAAUQSJAAAAeAAAIAAXAYKEAAAGAAAQAAQAwaEAAAE+AAQgAYBAogAAACCAAewAQAAgQAAAEDAAAQBAADMAAAAQCAABAEAACYgAAAgDwABAQAAGUcAAAgAQABAgAADAOAABABAACBAAAAACAABAEAAECAAAAGAAABAIAAQNgAAAygAABAQAAQjAAACCgAACDAAAgmAAAYAgAAIIAABCAAAAgBAAAQQAABIAAAAnCAAAhAAADgAAABxEAABMAAAAAAAAAB4AACgAAAAAAAAAAAAAKAAAAAAAAAABAAAUAAAAAAAAAAAAAAoAAAAAAAAAAAAABgAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAA';

  /* Cables, as a chain of short legs between repeated landing stations — the way
     real submarine systems are built (Sydney–Perth–Singapore, Cape Town–Durban–
     Mombasa–Djibouti, and so on) rather than one arc across each ocean. Endpoints
     were snapped to the nearest coastline cell and each leg's bow was then found by
     searching for a value that keeps the whole span over open water; every leg below
     was verified to cross zero land cells. A leg whose b.x exceeds 89 runs off the
     right edge of the map and continues from the left, which is how the Pacific
     routes are drawn even though the ocean itself was cropped away. */
  const MAP_LINKS = [
    [84.5, 14.5,  91.5, 14.5,   0.00],   // tokyo        → (pacific seam) → san francisco
    [78.5, 16.5,  92.5, 15.5,   1.54],   // shanghai     → (pacific seam) → los angeles
    [17.5, 13.5,  20.5, 12.5,   0.00],   // new york     → halifax
    [20.5, 12.5,  34.5,  6.5,   1.68],   // halifax      → reykjavik
    [34.5,  6.5,  39.5, 11.5,   0.29],   // reykjavik    → brest
    [15.5, 18.5,  17.5, 13.5,   0.81],   // miami        → new york
    [28.5, 27.5,  35.5, 21.5,   0.00],   // fortaleza    → dakar
    [35.5, 21.5,  38.5, 13.5,  -2.70],   // dakar        → lisbon
    [26.5, 33.5,  41.5, 23.5,   2.48],   // sao paulo    → lagos
    [41.5, 23.5,  46.5, 36.5,   2.68],   // lagos        → cape town
    [46.5, 36.5,  50.5, 34.5,   1.72],   // cape town    → durban
    [50.5, 34.5,  50.5, 35.5,   0.00],   // durban       → (bend)
    [50.5, 35.5,  52.5, 27.5,   2.15],   // (bend)       → mombasa
    [52.5, 27.5,  54.5, 21.5,   3.48],   // mombasa      → djibouti
    [54.5, 21.5,  56.5, 22.5,   0.00],   // djibouti     → (bend)
    [56.5, 22.5,  63.5, 20.5,   0.00],   // (bend)       → mumbai
    [63.5, 20.5,  64.5, 23.5,   0.00],   // mumbai       → colombo
    [64.5, 23.5,  72.5, 24.5,   0.00],   // colombo      → singapore
    [72.5, 24.5,  76.5, 18.5,   1.69],   // singapore    → hong kong
    [76.5, 18.5,  84.5, 14.5,   1.72],   // hong kong    → tokyo
    [87.5, 36.5,  77.5, 35.5,  -3.45],   // sydney       → perth
    [77.5, 35.5,  72.5, 24.5,  -3.99],   // perth        → singapore
    [39.5, 11.5,  34.5,  6.5,  -0.29],   // brest        → reykjavik
  ];

  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { alpha:false, antialias:false, powerPreference:'low-power' })
          || canvas.getContext('experimental-webgl');
  if (!gl){ showFallback(); return; }

  const VS = `
    attribute vec2 a_p;
    void main(){ gl_Position = vec4(a_p, 0., 1.); }
  `;
  const FS = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform vec2 u_res;
    uniform float u_time;    // real seconds — LED blink, decay
    uniform float u_flow;    // packet-travel clock; advances slowly under u_surge
    uniform float u_surge;   // 0..1 link saturation
    uniform float u_power;   // 1 = mains on, ~0 = blackout
    uniform float u_glitch;  // 0..1 torn-frame displacement
    uniform vec3  u_rand;    // per-load seed: lattice hash offset, blink rate
    uniform vec3  u_gl;      // per-run glitch shape: band height, reshuffle rate, throw
    uniform vec2  u_cell;    // title cell size (uv) and dot radius (device px)
    uniform vec2  u_t_jit;   // title jitter (uv)
    uniform vec3  u_t_pose;  // title opacity, skew slope, red tint
    uniform sampler2D u_tex; // dot-matrix title: one texel per dot
    uniform vec2  u_mcell;   // world-grid cell size (uv); the lattice is anchored to it
    uniform vec4  u_mapdots; // coast radius, port radius, lattice radius, lattice cell (uv)
    uniform vec2  u_morig;   // uv of the map's top-left corner (uv.y grows upward)
    uniform sampler2D u_map; // world mask: r = coastline, a = port (one texel per cell)
    uniform vec4  u_links[23];   // cable legs, in world cells (endpoints may exceed 89)
    uniform vec4  u_lparam[23];  // per leg: arc height, speed, phase, brightness
    uniform vec4  u_pad;     // breakout: paddle centre (uv), half width and half height (uv)
    uniform vec3  u_ball;    // breakout: ball centre (uv) and radius (uv)
    uniform vec4  u_arena;   // breakout: cabinet centre (uv), half width and half height (uv)
    uniform float u_play;    // 1 while the breakout extra owns the cabinet
    uniform float u_actors;  // 1 while the paddle and ball should be on screen
    uniform float u_flash;   // victory bloom over the whole frame
    uniform float u_reveal;  // victory write-head position, in dot columns (-1 when idle)

    float hash11(float n){ return fract(sin(n * 127.1) * 43758.5453123); }
    float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

    // crisp LED dot with an explicit radius, in device pixels
    float dotR(float dpx, float rad){ return 1. - smoothstep(rad - .9, rad + .9, dpx); }

    // One cable leg sampled at point p: a faint cable plus one light pulse
    // travelling from a to b. P holds arc height, speed, phase and brightness.
    float legAt(vec2 p, vec4 L, vec4 P){
      vec2 a = L.xy, b = L.zw;
      vec2 ba = b - a;
      float len = length(ba);
      if (len < .001) return 0.;
      vec2 dir = ba / len;
      vec2 rel = p - a;
      float along = dot(rel, dir);
      if (along < -2. || along > len + 2.) return 0.;
      float tn = along / len;
      // the cable bows outwards, so long-haul runs follow a rounded sea lane
      float arcOff = sin(clamp(tn, 0., 1.) * 3.14159265) * P.x;
      float dcPx = abs(dot(rel, vec2(-dir.y, dir.x)) - arcOff) * u_mcell.x * u_res.y;
      float cable = (1. - smoothstep(.45, 1.5, dcPx)) * .085;
      float u = fract(u_flow * P.y + P.z);
      float back = (u - tn) * len;                    // >0 once the head has passed
      float front = smoothstep(-.5, .5, back);        // nothing glows ahead of the head
      // Light travels inside the fibre, so it stays a compact pulse hugging the
      // cable instead of dragging a long comet tail. The tail here is ~0.4 cells
      // (a few pixels) and the halo barely reaches past the cable's own width.
      float pulse = (exp(-max(back, 0.) * 5.5) * .9 + exp(-back * back * 4.) * 2.2) * front;
      float prof = dotR(dcPx, 1.15) + exp(-dcPx * dcPx * 1.1) * .12;
      return (cable + pulse * prof) * P.w;
    }

    void main(){
      vec2 frag = gl_FragCoord.xy;
      // torn frame: shove whole scanline bands sideways; band height, reshuffle
      // rate and throw distance are redrawn for every glitch. Because the title
      // is sampled from this same displaced coordinate, it tears along with the
      // background instead of being animated separately.
      if (u_glitch > .001){
        float band = floor(frag.y / u_gl.x);
        frag.x += (hash11(band * 3.1 + floor(u_time * u_gl.y) * 7.3) - .5) * u_gl.z * u_glitch;
      }
      // lanes and the lattice are anchored to the world grid, so a cell is a
      // place on the map rather than a position on the screen
      vec2 uv  = (frag - .5 * u_res) / u_res.y;
      float pxsz = 1. / u_res.y;                      // one device pixel in uv units
      // #00e69c → alarm red; fully swapped at peak so the mix never goes olive
      vec3 green = mix(vec3(.0, .902, .612), vec3(1., .16, .09), u_surge);
      vec3 col = mix(vec3(.013, .055, .033), vec3(.055, .016, .013), u_surge);
      float boost = 1. + u_surge * 1.2;

      // cell coordinates: y grows downward, (0,0) is the map's top-left
      vec2 mg = vec2(uv.x - u_morig.x, u_morig.y - uv.y) / u_mcell.x;
      vec2 cid = floor(mg);
      float mapCellPx = u_mcell.x * u_res.y;
      float distPx = length(fract(mg) - .5) * mapCellPx;

      // The background lattice has its own spacing rather than reusing the map grid.
      // A phone fits the same 89 cells into far fewer pixels, and sharing that grid
      // would blanket the screen in dots (roughly 3x as many as on a desktop); this
      // keeps the texture at a steady screen-space density instead.
      vec2 ag = vec2(uv.x - u_morig.x, u_morig.y - uv.y) / u_mapdots.w;
      vec2 acid = floor(ag);
      float ambCellPx = u_mapdots.w * u_res.y;
      float ambDistPx = length(fract(ag) - .5) * ambCellPx;
      float blink = step(.955, hash21(acid + floor(u_time * u_rand.z) * 1.7)) * .3;
      float amb = dotR(ambDistPx, u_mapdots.z) * (.035 + .03 * hash21(acid * 1.7 + u_rand.x) + blink);

      // land outlines: a faint tracer on the coast, brighter where a port sits.
      // These radii track the map cell, so a phone shows the same proportion of
      // dot to gap as a desktop rather than a chunkier grid.
      vec4 mp = texture2D(u_map, (cid + .5) / vec2(128., 64.));
      float inMap = step(-.5, cid.x) * step(cid.x, 88.5) * step(-.5, cid.y) * step(cid.y, 44.5);
      float coast = dotR(distPx, u_mapdots.x) * inMap;
      float port  = dotR(distPx, u_mapdots.y) * inMap;
      float pulse = .8 + .2 * sin(u_time * 1.6 + cid.x * .7 + cid.y * 1.3);
      col += green * (amb + (coast * mp.r * .34 + port * mp.a * .68 * pulse)) * boost;

      // ---- traffic between regions: fixed cables, one packet each ----
      // Each cable is a chain of short legs that land at repeated stations, the way
      // real submarine systems are built, rather than one long arc across an ocean.
      float pk = 0.;
      for (int i = 0; i < 23; i++){
        pk += legAt(mg, u_links[i], u_lparam[i]);
        // A leg that runs past the right edge is also evaluated one map width to
        // the left, so the Pacific routes leave the frame and come back in on the
        // other side instead of stopping at the seam.
        if (u_links[i].z > 89.) pk += legAt(mg + vec2(89., 0.), u_links[i], u_lparam[i]);
      }
      col += green * pk * boost;

      // ---- dot-matrix title ----
      float cellPx = u_cell.x * u_res.y;
      float tOp = u_t_pose.x;
      if (tOp > .002){
        vec2 lc = (uv - u_t_jit) / u_cell.x;            // title-local, in cell units
        lc.x += lc.y * u_t_pose.y;                      // skew
        vec2 bd = abs(lc) - vec2(53., 5.) * .5;
        float plate = 1. - smoothstep(0., 5., max(bd.x, bd.y));
        col *= 1. - .38 * tOp * plate;

        vec2 g = lc + vec2(53., 5.) * .5;               // 0..COLS / 0..ROWS
        float gi = floor(g.x), gj = floor(g.y);
        float ch  = floor(gi / 6.);                     // char index (5 wide + 1 gap)
        float col5 = gi - ch * 6.;
        float gRow = 4. - gj;                           // glyph rows run top-down
        float inside = step(0., gi) * step(gi, 52.5) * step(0., gj) * step(gj, 4.5)
                     * step(col5, 4.5) * step(ch, 8.5);
        float dc = ch * 5. + col5;                      // dot column in the texture
        float on = step(.5, texture2D(u_tex, vec2((dc + .5) / 64., (gRow + .5) / 8.)).r) * inside;

        vec2 d = fract(g) - .5;                         // offset from the dot centre
        float distPx = length(d) * cellPx;
        float core = 1. - smoothstep(u_cell.y - .8, u_cell.y + .8, distPx);
        float glow = exp(-distPx * distPx / (2. * (cellPx * .95) * (cellPx * .95)));
        // "netns" reads brighter than the ".dev" suffix, as in the text version
        vec3 tcol = mix(vec3(.918, 1., .961), vec3(0., .902, .612), step(4.5, ch));
        tcol = mix(tcol, vec3(1., .16, .09), u_t_pose.z);
        col += tcol * (core + glow * .5) * on * tOp;

        // Victory: a bar of light travelling across the wall as the wordmark is
        // written back on. It is drawn over the plate rather than over the dots, so
        // it leads the letters in rather than lighting up what is already there. Its
        // band is tighter than the plate's — the plate fades out over five cells,
        // which is right for the backing but far too tall for a scanning bar.
        if (u_reveal >= 0.){
          float band = (1. - smoothstep(0., .9, abs(lc.y) - 2.5))
                     * (1. - smoothstep(0., .9, abs(lc.x) - 26.5));
          float hx = gi + .5 - u_reveal;
          col += vec3(.918, 1., .961) * exp(-hx * hx * .5) * band * .75;
        }
      }

      // ---- breakout extra: the cabinet, the paddle and the ball ----------------
      // Drawn with the same idiom as every other mark on the page — a hard core
      // plus a soft halo, and a single crisp rule for the frame — so the extra
      // reads as part of the sign rather than something pasted over it. The wall
      // needs no code here: it is the wordmark's own dots, left at their own size,
      // and "destroyed" just means those texels are uploaded dark.
      if (u_play > .5){
        vec2 fp = frag - .5 * u_res;                    // centred device pixels
        vec3 ink  = vec3(.918, 1., .961);
        vec3 tint = mix(green, ink, .55);

        // the cabinet: distance to the arena's outline, so the rule stays two
        // device pixels wide on any display
        vec2 ap = fp - vec2(u_arena.x, u_arena.y) * u_res.y;
        vec2 ah = vec2(u_arena.z, u_arena.w) * u_res.y;
        vec2 ae = abs(ap) - ah;
        float ad = length(max(ae, 0.)) + min(max(ae.x, ae.y), 0.);
        col += mix(green, ink, .30) * (1. - smoothstep(1., 2.4, abs(ad))) * .85;

        if (u_actors > .5){
          vec2 pc = vec2(u_pad.x, u_pad.y) * u_res.y;
          float hw = u_pad.z * u_res.y, hh = u_pad.w * u_res.y;
          vec2 pr = fp - pc;
          // distance to the bar's horizontal axis, minus its radius: a capsule
          float pd = length(vec2(pr.x - clamp(pr.x, -hw, hw), pr.y)) - hh;
          float pcore = 1. - smoothstep(-.8, .8, pd);
          float pgap = max(pd, 0.), psig = hh * 2.6;
          col += tint * (pcore + exp(-pgap * pgap / (2. * psig * psig)) * .55) * 1.05;

          float brad = u_ball.z * u_res.y;
          float bdist = length(fp - vec2(u_ball.x, u_ball.y) * u_res.y) - brad;
          float bcore = 1. - smoothstep(-.7, .7, bdist);
          float bgap = max(bdist, 0.), bsig = brad * 3.2;
          col += mix(tint, ink, .5) * (bcore * 1.15 + exp(-bgap * bgap / (2. * bsig * bsig)) * .5);
        }
      }

      // Victory bloom. Green and white, deliberately not the red the error uses —
      // the two endings have to be tellable apart at a glance.
      col += mix(vec3(.0, .902, .612), vec3(.918, 1., .961), .45) * u_flash * .4;

      // vignette + fine grain
      float r = length(uv);
      col *= 1. - r * .5;
      col += (hash21(frag + fract(u_time)) * 2. - 1.) * .006;

      col *= u_power;                                 // mains switch
      gl_FragColor = vec4(col, 1.);
    }
  `;

  function shader(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
  } catch (err){
    console.error('netns shader failed, falling back to plain title:', err);
    showFallback();
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();                      // fullscreen triangle
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'a_p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uTime  = gl.getUniformLocation(prog, 'u_time');
  const uFlow  = gl.getUniformLocation(prog, 'u_flow');
  const uSurge = gl.getUniformLocation(prog, 'u_surge');
  const uPower = gl.getUniformLocation(prog, 'u_power');
  const uGlitch= gl.getUniformLocation(prog, 'u_glitch');
  const uRand  = gl.getUniformLocation(prog, 'u_rand');
  const uGl    = gl.getUniformLocation(prog, 'u_gl');
  const uCell  = gl.getUniformLocation(prog, 'u_cell');
  const uTJit  = gl.getUniformLocation(prog, 'u_t_jit');
  const uTPose = gl.getUniformLocation(prog, 'u_t_pose');
  const uTex   = gl.getUniformLocation(prog, 'u_tex');
  const uMCell = gl.getUniformLocation(prog, 'u_mcell');
  const uMapDots = gl.getUniformLocation(prog, 'u_mapdots');
  const uMOrig = gl.getUniformLocation(prog, 'u_morig');
  const uMap   = gl.getUniformLocation(prog, 'u_map');
  const uLinks = gl.getUniformLocation(prog, 'u_links[0]');
  const uLParam= gl.getUniformLocation(prog, 'u_lparam[0]');
  const uPad   = gl.getUniformLocation(prog, 'u_pad');
  const uBall  = gl.getUniformLocation(prog, 'u_ball');
  const uPlay  = gl.getUniformLocation(prog, 'u_play');
  const uActors= gl.getUniformLocation(prog, 'u_actors');
  const uArena = gl.getUniformLocation(prog, 'u_arena');
  const uFlash = gl.getUniformLocation(prog, 'u_flash');
  const uReveal= gl.getUniformLocation(prog, 'u_reveal');

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

  /* ---- title texture (unit 0): one texel per title dot ---- */
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(uTex, 0);

  shownChars = [...WORD];
  function markTitleDirty(){ texDirty = true; }
  markTitleDirty();

  /* ---- world texture (unit 1): coastline mask + port marks ---- */
  const MAP_TW = 128, MAP_TH = 64;
  const mapTex = gl.createTexture();
  const mapData = new Uint8Array(MAP_TW * MAP_TH * 2);   // LUMINANCE_ALPHA pairs
  {
    const bin = atob(MAP_MASK);
    // the texture is 128 wide while the mask rows are 112 bits, so each row is
    // written at its own stride — packing them end to end would shear the map
    for (let row = 0; row < MAP_ROWS; row++){
      for (let col = 0; col < MAP_COLS; col++){
        const i = row * MAP_COLS + col;
        if ((bin.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1)
          mapData[(row * MAP_TW + col) * 2] = 255;
      }
    }
    for (const [ax, ay, bx, by] of MAP_LINKS){
      for (const [x, y] of [[ax, ay], [bx, by]]){
        const i = (Math.floor(y) * MAP_TW + Math.floor(x)) * 2 + 1;  // endpoints are cell centres
        mapData[i] = 255;
      }
    }
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, mapTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE_ALPHA, MAP_TW, MAP_TH, 0,
                gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, mapData);
  gl.uniform1i(uMap, 1);

  /* ---- cable geometry: endpoints plus a per-cable arc, speed and phase ---- */
  const linkData = new Float32Array(MAP_LINKS.length * 4);
  const paramData = new Float32Array(MAP_LINKS.length * 4);
  MAP_LINKS.forEach(([ax, ay, bx, by, bow], i) => {
    linkData.set([ax, ay, bx, by], i * 4);
    paramData.set([
      bow,                                            // precomputed water-clearing arc
      rnd(.15, .3),                                   // packet speed (cycles per second)
      Math.random(),                                  // phase along the cable
      rnd(.55, 1),                                    // brightness
    ], i * 4);
  });
  gl.uniform4fv(uLinks, linkData);
  gl.uniform4fv(uLParam, paramData);

  // per-load seed: lattice hash offset / (unused) / blink rate
  gl.uniform3f(uRand, Math.random(), 0, rnd(.45, 1.6));
  gl.uniform3f(uGl, 18, 22, 90);                      // overwritten on each glitch

  let cellCss = 9, resY = 0, titleOffY = 0;
  function metrics(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    resY = canvas.height;

    // title: shrink the 53-col block to fit narrow screens. Sized before the map
    // because the portrait layout positions the mark relative to the map, and its
    // dot radius is the ceiling for every map dot.
    cellCss = clamp(innerWidth * .38 / COLS, 4, 6.5);
    const dotPx = cellCss * dpr * .30;
    gl.uniform2f(uCell, cellCss * dpr / resY, dotPx);

    /* On a wide screen the map is centred and the wordmark sits over open ocean,
       which reads well. A portrait phone cannot do that: an 89:45 map only fills a
       thin band of a tall screen, so the mark would land on top of a small map and
       the two would muddy each other. Portrait instead scales the map to the full
       width and treats map + wordmark as one centred group, with the mark tucked
       under the map — a stacked composition rather than a collision. */
    const portrait = innerHeight > innerWidth;
    const scale = portrait
      ? innerWidth * .98 / MAP_COLS
      : Math.min(innerWidth / MAP_COLS, innerHeight / MAP_ROWS) * .86;
    const cellUv  = scale * dpr / resY;
    const wUv = MAP_COLS * cellUv, hUv = MAP_ROWS * cellUv;
    gl.uniform2f(uMCell, cellUv, cellUv);

    if (portrait){
      const titleH  = ROWS * cellCss * dpr / resY;      // wordmark height in uv
      const gapUv   = .055;                             // space between map and mark
      const mapTop  = (hUv + gapUv + titleH) * .5;      // centre the whole group
      gl.uniform2f(uMOrig, -.5 * wUv, mapTop);
      titleOffY = mapTop - hUv - gapUv - titleH * .5;   // mark centre, just below
    } else {
      gl.uniform2f(uMOrig, -.5 * wUv, .5 * hUv);         // uv.y grows upward
      titleOffY = 0;
    }

    // Map and lattice dot sizes. Radii are fractions of their own cell so the
    // texture looks the same on any screen, but they never exceed the wordmark's
    // dot radius — the mark stays the boldest thing on the page. The lattice keeps
    // a minimum spacing so a fine portrait map grid does not turn the background
    // into a dense field of dots.
    const mapCellPx = scale * dpr;
    const coastR = Math.min(mapCellPx * .123, dotPx * .78);
    const portR  = Math.min(mapCellPx * .160, dotPx * .95);
    const ambCellPx = Math.max(mapCellPx, 11 * dpr);
    const ambR   = Math.min(ambCellPx * .078, dotPx * .50);
    gl.uniform4f(uMapDots, coastR, portR, ambR, ambCellPx / resY);

    /* While the extra is running the wordmark keeps this exact size and dot radius
       and only moves, riding the top edge of the cabinet. The map and lattice are
       left alone, and nothing here writes a value that varies between frames, so
       leaving a round takes another metrics() call and nothing else. titleOffY is
       the mark's centre in uv (positive upward, from the frame centre), so it
       converts straight to the screen y the cabinet needs. */
    if (BRK.on) brkLayout(cellCss, innerHeight / 2 - titleOffY * innerHeight);
    return dpr;
  }
  let dpr = 1;
  function resize(){ dpr = metrics(); }
  resize();
  addEventListener('resize', resize);

  /* The canvas is behind the page, so the title needs its own pointer handling. */
  function titleHit(x, y){
    const w = COLS * cellCss, h = ROWS * cellCss;
    const x0 = (innerWidth - w) / 2;
    // titleOffY is in uv units (one unit = the full viewport height, measured from
    // the centre, positive upward), so converting to CSS pixels from the top means
    // subtracting the whole offset, not half of it.
    const y0 = (innerHeight - h) / 2 - titleOffY * innerHeight;
    return x >= x0 - 8 && x <= x0 + w + 8 && y >= y0 - 8 && y <= y0 + h + 8;
  }
  addEventListener('pointermove', (e) => {
    if (BRK.on) return;                                 // the field owns the pointer
    document.body.style.cursor = titleHit(e.clientX, e.clientY) ? 'pointer' : '';
  }, { passive: true });
  addEventListener('click', (e) => {
    if (BRK.on) return;
    if (titleHit(e.clientX, e.clientY)) fxDecrypt();
  });

  /* ============ the hidden extra, in full ============
     Double-tap the wordmark and its own dots become a brick wall: the title is
     magnified and parked at the top, a paddle appears at the bottom, and the whole
     viewport becomes the field. Geometry lives in CSS pixels with the origin at the
     top-left, and is converted to the uniforms' uv only when it is written, so the
     collision code and the shader cannot disagree about where anything is. The ball
     is advanced at a fixed tick and its speed is a number rather than a vector
     length, so a fast ball cannot step straight through a brick on a slow frame. */
  const BRK_STEP = 1 / 240;                             // fixed physics tick, in seconds
  const BRK_WIN_DUR = 1;                                // how long the wall takes to redraw
  const BRK_LOSE_DUR = .85;                             // how long the error wash holds

  function brkBuildBricks(){
    // a brick is a run of lit dots in one row — which is why a letter breaks apart
    // stroke by stroke rather than vanishing whole
    BRK.bricks = [];
    BRK.alive = 0;
    for (let row = 0; row < ROWS; row++){
      for (let col = 0; col < COLS; col++){
        if (!BRK.dots[row * COLS + col]) continue;
        let end = col;
        while (end + 1 < COLS && BRK.dots[row * COLS + end + 1]) end++;
        BRK.bricks.push({
          row, c0: col, c1: end, alive: true,
          x0: BRK.wallL + col * BRK.cell, x1: BRK.wallL + (end + 1) * BRK.cell,
          y0: BRK.wallT + row * BRK.cell, y1: BRK.wallT + (row + 1) * BRK.cell,
        });
        BRK.alive++;
        col = end;
      }
    }
  }

  /* The wall's texture. Same layout as dotTexture(), except a dot that has been
     knocked out is uploaded dark — so "the brick is gone" needs no code in the
     shader at all. */
  function brkTexture(){
    const buf = new Uint8Array(TEX_W * TEX_H);
    for (let c = 0; c < NCHAR; c++){
      const rows = FONT[WORD[c]];
      for (let r = 0; r < ROWS; r++){
        for (let k = 0; k < GLYPH_W; k++){
          if (!(rows[r] >> (GLYPH_W - 1 - k) & 1)) continue;
          if (!BRK.dots[r * COLS + c * (GLYPH_W + GLYPH_GAP) + k]) continue;
          buf[r * TEX_W + c * GLYPH_W + k] = 255;
        }
      }
    }
    return buf;
  }

  /* The error screen: ERROR, spelled in the same dot matrix, centred in the same
     nine character cells the wordmark occupies. It paints whole lit dots rather
     than the wall's remaining ones, because by the time it shows, the wall is
     irrelevant. */
  function brkErrorTexture(){
    const buf = new Uint8Array(TEX_W * TEX_H);
    const word = 'ERROR', off = ((NCHAR - word.length) / 2) | 0;   // 2 cells in from each end
    for (let i = 0; i < word.length; i++){
      const rows = FONT[word[i]], c = off + i;
      for (let r = 0; r < ROWS; r++)
        for (let k = 0; k < GLYPH_W; k++)
          if (rows[r] >> (GLYPH_W - 1 - k) & 1) buf[r * TEX_W + c * GLYPH_W + k] = 255;
    }
    return buf;
  }

  /* The cabinet. The wordmark keeps the size the page already gave it — blowing it
     up made the letters coarse — and instead gets a bordered arena around it, with
     the mark sitting on the arena's top edge as the brick wall. Everything below
     that edge is playfield. */
  function brkLayout(cellPx, logoCy){
    const cell = BRK.cell = cellPx;
    const logoW = COLS * cell, logoH = ROWS * cell;
    const pad = Math.max(7, cell * 1.5);

    BRK.W = logoW + pad * 2;
    // roughly square, and never more than about half the screen, so the cabinet
    // always fits whichever axis is the tight one
    BRK.H = Math.max(logoH + pad * 5, Math.min(BRK.W * .92, innerHeight * .58));
    BRK.ax = (innerWidth - BRK.W) / 2;
    // The mark keeps the exact position the layout gave it and the cabinet is built
    // around it, so entering a round does not make the logo jump. Portrait puts the
    // mark under the map rather than at the centre, which is why its real centre is
    // passed in. Only when the cabinet would not fit at that spot does it slide, and
    // the mark rides along with it.
    const wantAy = logoCy - pad - logoH / 2;
    BRK.ay = clamp(wantAy, 12, Math.max(12, innerHeight - 12 - BRK.H));

    BRK.wallT = pad;                                    // the wall hugs the cabinet's top edge
    BRK.wallL = pad;
    BRK.jy = (innerHeight / 2 - (BRK.ay + pad + logoH / 2)) / innerHeight;
    brkBuildBricks();

    const p = BRK.pad;
    p.hw = clamp(BRK.W * .10, 16, 60);
    p.hh = clamp(p.hw * .16, 2.5, 5.5);
    p.y  = BRK.H - Math.max(15, BRK.H * .10);
    if (!p.x) p.x = BRK.W / 2;
    p.x = p.target = clamp(p.x, p.hw, BRK.W - p.hw);

    // everything scales off the cabinet, so the game plays the same on a phone as
    // on a wide monitor instead of getting frantic in a small box
    BRK.ballR = clamp(cell * .45, 3, 7);
    BRK.base  = clamp(BRK.W * .72, 160, 430);
    BRK.speed = BRK.speed ? clamp(BRK.speed, BRK.base, BRK.base * 1.5) : BRK.base;
    const B = BRK.ball;
    B.r = BRK.ballR;
    // a resize mid-round can leave the ball outside the new cabinet
    B.x = clamp(B.x, B.r, BRK.W - B.r);
    if (B.y - B.r > BRK.H - 12){ B.x = p.x; B.y = p.y - p.hh - B.r - 1; }
  }

  function brkServe(delay){
    const p = BRK.pad, B = BRK.ball;
    BRK.speed = BRK.base;
    B.r = BRK.ballR;
    B.x = p.x;
    B.y = p.y - p.hh - B.r - 1;
    // up and off to one side, but never so flat that the ball just runs the width
    const ang = between(-1, 1) * rnd(.18, .45) + rnd(-.2, .2);
    B.vx = Math.sin(ang) * BRK.speed;
    B.vy = -Math.cos(ang) * BRK.speed;
    BRK.hold = delay;
  }

  function brkAim(cssX){
    const p = BRK.pad;
    p.target = clamp(cssX - BRK.ax, p.hw, BRK.W - p.hw);   // screen x → arena-local x
    p.x = p.target;                                     // a dragged paddle should not lag
  }

  // Ball against a brick, treating the ball as a point against the brick swollen by
  // its radius, then pushed out along whichever axis it was least far inside.
  function brkResolve(br){
    const B = BRK.ball, r = B.r;
    const ex0 = br.x0 - r, ex1 = br.x1 + r, ey0 = br.y0 - r, ey1 = br.y1 + r;
    if (B.x < ex0 || B.x > ex1 || B.y < ey0 || B.y > ey1) return false;
    const ovx = Math.min(B.x - ex0, ex1 - B.x);
    const ovy = Math.min(B.y - ey0, ey1 - B.y);
    if (ovx < ovy){
      if (B.x < (br.x0 + br.x1) / 2){ B.x = ex0; B.vx = -Math.abs(B.vx); }
      else                          { B.x = ex1; B.vx =  Math.abs(B.vx); }
    } else {
      if (B.y < (br.y0 + br.y1) / 2){ B.y = ey0; B.vy = -Math.abs(B.vy); }
      else                          { B.y = ey1; B.vy =  Math.abs(B.vy); }
    }
    return true;
  }

  function brkBreak(br){
    br.alive = false;
    BRK.alive--;
    for (let c = br.c0; c <= br.c1; c++) BRK.dots[br.row * COLS + c] = 0;
    BRK.speed = Math.min(BRK.speed * 1.02, BRK.base * 1.5);
    texDirty = true;
    if (!BRK.alive){
      // Wall down: the dots are all gone, so the victory sweep is what puts the
      // wordmark back rather than a separate effect laid over a blank wall.
      BRK.win = true; BRK.winT = 0; BRK.revealed = 0;
      BRK.dots.fill(0);
      sfxWin();
    } else sfxHit(br.row);
  }

  /* The wordmark writes itself back on, one dot column at a time, with a bar of
     light at the leading edge — the same letterforms eroding, in reverse. */
  function brkRevealCol(c){
    const ch = (c / (GLYPH_W + GLYPH_GAP)) | 0, k = c - ch * (GLYPH_W + GLYPH_GAP);
    if (ch >= NCHAR || k >= GLYPH_W) return;            // a gap column holds no dots
    const rows = FONT[WORD[ch]];
    for (let r = 0; r < ROWS; r++)
      if (rows[r] >> (GLYPH_W - 1 - k) & 1) BRK.dots[r * COLS + c] = 1;
  }

  function brkWinStep(dt){
    BRK.winT += dt;
    const p = Math.min(1, BRK.winT / BRK_WIN_DUR);
    const upto = Math.min(COLS, Math.ceil(p * COLS));
    while (BRK.revealed < upto){
      brkRevealCol(BRK.revealed++);
      texDirty = true;
    }
    if (p >= 1) brkEnd();
  }

  /* Losing the ball ends the round: the field washes red where it stands, and the
     red overload carries it back to the plain wordmark. */
  function brkLose(){
    if (BRK.lose) return;
    BRK.lose = true; BRK.loseT = 0;
    texDirty = true;
    sfxLose();
    fxOverload();                                       // the red alert is the wash
  }

  // Re-assert the ball's speed, and refuse to let it settle into a horizontal rattle.
  function brkRenorm(){
    const B = BRK.ball;
    const s = Math.hypot(B.vx, B.vy) || 1;
    B.vx = B.vx / s * BRK.speed;
    B.vy = B.vy / s * BRK.speed;
    const minVy = BRK.speed * .28;
    if (Math.abs(B.vy) < minVy) B.vy = B.vy < 0 ? -minVy : minVy;
  }

  function brkTick(h){
    const p = BRK.pad, B = BRK.ball;

    const ks = (BRK.keys.r ? 1 : 0) - (BRK.keys.l ? 1 : 0);
    if (ks) p.target = clamp(p.target + ks * BRK.W * .95 * h, p.hw, BRK.W - p.hw);
    p.x += (p.target - p.x) * Math.min(1, h * 26);

    if (BRK.hold > 0){                                  // ball sits on the bar
      BRK.hold -= h;
      B.x = p.x;
      B.y = p.y - p.hh - B.r - 1;
      return;
    }

    B.x += B.vx * h;
    B.y += B.vy * h;
    const r = B.r;

    if (B.x - r < 0){ B.x = r; B.vx = Math.abs(B.vx); }
    else if (B.x + r > BRK.W){ B.x = BRK.W - r; B.vx = -Math.abs(B.vx); }
    if (B.y - r < 0){ B.y = r; B.vy = Math.abs(B.vy); }

    if (B.y - r < BRK.wallT + ROWS * BRK.cell){
      for (const br of BRK.bricks){
        if (!br.alive) continue;
        if (B.x + r < br.x0 || B.x - r > br.x1 || B.y + r < br.y0 || B.y - r > br.y1) continue;
        if (brkResolve(br)){ brkBreak(br); break; }
      }
    }

    if (B.vy > 0 && B.y + r >= p.y - p.hh && B.y - r <= p.y + p.hh
        && B.x + r >= p.x - p.hw && B.x - r <= p.x + p.hw){
      B.y = p.y - p.hh - r;
      const ang = clamp((B.x - p.x) / p.hw, -1, 1) * 1.05;   // ≤ ~60° off vertical
      B.vx = Math.sin(ang) * BRK.speed;
      B.vy = -Math.cos(ang) * BRK.speed;
    }

    brkRenorm();
    if (B.y - r > BRK.H) brkLose();
  }

  function brkStep(dt){
    if (!BRK.on) return;
    if (BRK.win){ brkWinStep(dt); return; }
    if (BRK.lose){
      BRK.loseT += dt;
      if (BRK.loseT >= BRK_LOSE_DUR) brkEnd();          // fxOverload is already running
      return;
    }
    BRK.acc = Math.min(BRK.acc + dt, .25);
    while (BRK.acc >= BRK_STEP){ brkTick(BRK_STEP); BRK.acc -= BRK_STEP; }
  }

  function brkStart(){
    if (reduced || BRK.on) return false;
    BRK.dots = new Uint8Array(COLS * ROWS);
    for (let c = 0; c < NCHAR; c++){
      const rows = FONT[WORD[c]];
      for (let r = 0; r < ROWS; r++)
        for (let k = 0; k < GLYPH_W; k++)
          if (rows[r] >> (GLYPH_W - 1 - k) & 1)
            BRK.dots[r * COLS + c * (GLYPH_W + GLYPH_GAP) + k] = 1;
    }
    BRK.speed = 0;
    BRK.pad.x = 0;
    BRK.keys.l = BRK.keys.r = false;
    BRK.win = false; BRK.lose = false; BRK.revealed = 0;
    BRK.acc = 0;
    BRK.on = true;
    document.documentElement.classList.add('playing');
    fxSuspend();                                        // the sign stands down
    metrics();                                          // sizes the field, magnifies the wall
    texDirty = true;
    brkServe(.9);
    sfxStart();
    return true;
  }

  function brkEnd(){
    if (!BRK.on) return;
    BRK.on = false;
    BRK.win = false; BRK.lose = false;
    BRK.keys.l = BRK.keys.r = false;
    document.documentElement.classList.remove('playing');
    metrics();                                          // the wordmark returns as itself
    texDirty = true;
    fxResume();
  }

  if (!reduced){
    BRK.run = { start: brkStart, end: brkEnd };

    addEventListener('dblclick', (e) => {
      if (BRK.on) return;
      if (titleHit(e.clientX, e.clientY)){ e.preventDefault(); brkStart(); }
    });
    /* iOS does not reliably fire dblclick for a double-tap, so a finger gets its
       own detector. It only ever looks at taps that land on the title, so it cannot
       interfere with dragging the paddle or with anything else on the page. */
    let lastTap = 0, lastX = 0, lastY = 0;
    addEventListener('pointerdown', (e) => {
      if (BRK.on || e.pointerType === 'mouse') return;
      if (!titleHit(e.clientX, e.clientY)) return;
      const t = performance.now();
      if (t - lastTap < 350 && Math.abs(e.clientX - lastX) < 40 && Math.abs(e.clientY - lastY) < 40){
        lastTap = 0;
        brkStart();
        return;
      }
      lastTap = t; lastX = e.clientX; lastY = e.clientY;
    }, { passive: true });

    // pointer: a mouse aims on hover, a finger aims while it is down
    let dragId = null;
    addEventListener('pointerdown', (e) => {
      if (!BRK.on) return;
      dragId = e.pointerId;
      brkAim(e.clientX);
      e.preventDefault();                               // no text selection under the field
    }, { passive: false });
    addEventListener('pointermove', (e) => {
      if (!BRK.on) return;
      if (e.pointerType === 'mouse' || e.pointerId === dragId) brkAim(e.clientX);
    }, { passive: true });
    addEventListener('pointerup', (e) => { if (e.pointerId === dragId) dragId = null; }, { passive: true });
    addEventListener('pointercancel', () => { dragId = null; }, { passive: true });

    addEventListener('keydown', (e) => {
      if (!BRK.on) return;
      const k = e.key;
      if (k === 'Escape'){ brkEnd(); return; }
      // A tap has to move the bar even though keydown and keyup both land between
      // two ticks, so the first press nudges the target directly; holding the key
      // then moves it continuously. Auto-repeat re-sends keydown, so the nudge is
      // gated on the key not being down already.
      if (k === 'ArrowLeft'  || k === 'a' || k === 'A'){
        if (!BRK.keys.l) BRK.pad.target = clamp(BRK.pad.target - BRK.W * .022, BRK.pad.hw, BRK.W - BRK.pad.hw);
        BRK.keys.l = true; e.preventDefault();
      } else if (k === 'ArrowRight' || k === 'd' || k === 'D'){
        if (!BRK.keys.r) BRK.pad.target = clamp(BRK.pad.target + BRK.W * .022, BRK.pad.hw, BRK.W - BRK.pad.hw);
        BRK.keys.r = true; e.preventDefault();
      } else if (k === ' '){ e.preventDefault(); }        // space would scroll the page
    });
    addEventListener('keyup', (e) => {
      const k = e.key;
      if (k === 'ArrowLeft'  || k === 'a' || k === 'A') BRK.keys.l = false;
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') BRK.keys.r = false;
    });
    addEventListener('blur', () => { BRK.keys.l = BRK.keys.r = false; });
  }

  const t0 = performance.now();
  let flow = 0, last = t0;

  function frame(now){
    const dt = Math.min((now - last) / 1000, .1);
    last = now;

    // each envelope reads the shape its bin drew when it fired
    let surge = 0;
    const S = FX.surge;
    if (S){
      const e = now - S.t0;
      if (e >= 0 && e < S.dur)
        surge = Math.min(e / S.ramp, 1) * Math.min(1, Math.max(0, (S.dur - e) / S.release));
      else FX.surge = null;
    }

    let power = 1;
    const B = FX.blackout;
    if (B){
      const e = now - B.t0;
      if (e >= 0 && e < B.dur){
        if (e < B.cut) power = 1 - e / B.cut;
        else if (e < B.cut + B.dead) power = .015;
        else {
          const seg = Math.floor((e - B.cut - B.dead) / B.seg);
          const r = Math.abs(Math.sin(seg * 12.9898 + B.seed) * 43758.5453) % 1;
          power = r < .45 ? .02 : (.35 + r * .65);
        }
      } else FX.blackout = null;
    }

    let glitch = 0;
    const G = FX.glitch;
    if (G){
      const e = now - G.t0;
      if (e >= 0 && e < G.dur){
        glitch = (Math.floor(e / (G.dur / 4)) % 2 === 0 ? 1 : .3) * (1 - e / G.dur);
        gl.uniform3f(uGl, G.band, G.rate, G.mag);
      } else FX.glitch = null;
    }

    // one-shot title stutter takes over the pose; otherwise the idle loop owns it
    if (pulse){
      const e = now - pulse.t0;
      const f = pulse.frames;
      if (e >= 0 && e < pulse.dur){
        let i = 0;
        while (i < f.length - 1 && f[i + 1].t <= e) i++;
        T.op = f[i].op; T.jx = f[i].jx; T.jy = f[i].jy; T.skew = f[i].skew;
        T.red = pulse.alert ? 1 : 0;
      }
    }

    if (texDirty){
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      const buf = BRK.on ? (BRK.lose ? brkErrorTexture() : brkTexture()) : dotTexture(shownChars);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TEX_W, TEX_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, buf);
      texDirty = false;
    }

    brkStep(dt);

    // Links congest under load, so the healthy state runs fast and the red alert
    // throttles traffic to a crawl. Accumulated separately from u_time so the
    // packet phase stays continuous — the slowdown is a rate change, not a jump.
    flow += dt * (1 - .82 * surge);
    gl.uniform1f(uTime,  (now - t0) / 1000);
    gl.uniform1f(uFlow,  flow);
    gl.uniform1f(uSurge, surge);
    gl.uniform1f(uPower, power);
    gl.uniform1f(uGlitch, glitch);
    // the wall is parked at the top of the frame while a round is on; otherwise the
    // title sits wherever the layout put it
    gl.uniform2f(uTJit, T.jx * dpr / resY, (T.jy * dpr / resY) + (BRK.on ? BRK.jy : titleOffY));
    gl.uniform3f(uTPose, T.op, T.skew, T.red);
    gl.uniform1f(uPlay, BRK.on ? 1 : 0);
    gl.uniform1f(uActors, BRK.on && !BRK.win && !BRK.lose ? 1 : 0);
    if (BRK.on){
      // arena-local CSS pixels to the shader's uv: x and y are both measured against
      // the frame height, from the centre of the frame, with y growing upward
      const k = 1 / innerHeight, P = BRK.pad, B = BRK.ball;
      gl.uniform4f(uArena, (BRK.ax + BRK.W / 2 - innerWidth / 2) * k,
                           (innerHeight / 2 - BRK.ay - BRK.H / 2) * k, BRK.W / 2 * k, BRK.H / 2 * k);
      gl.uniform4f(uPad, (BRK.ax + P.x - innerWidth / 2) * k,
                         (innerHeight / 2 - BRK.ay - P.y) * k, P.hw * k, P.hh * k);
      gl.uniform3f(uBall, (BRK.ax + B.x - innerWidth / 2) * k,
                          (innerHeight / 2 - BRK.ay - B.y) * k, B.r * k);
    }
    // victory: a bloom that decays away, and a write-head crossing the wall
    const wp = BRK.win ? Math.min(1, BRK.winT / BRK_WIN_DUR) : -1;
    gl.uniform1f(uFlash, wp < 0 ? 0 : Math.sin(Math.min(1, wp * 1.6) * Math.PI) * .5);
    gl.uniform1f(uReveal, wp < 0 ? -1 : wp * COLS);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  if (reduced){                                       // one static frame, no effects
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TEX_W, TEX_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE,
                  dotTexture([...WORD]));
    gl.uniform1f(uTime, 0);
    gl.uniform1f(uFlow, 0);
    gl.uniform1f(uSurge, 0);
    gl.uniform1f(uPower, 1);
    gl.uniform1f(uGlitch, 0);
    gl.uniform2f(uTJit, 0, 0);
    gl.uniform3f(uTPose, 1, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return;
  }

  let raf = requestAnimationFrame(function loop(now){
    frame(now);
    raf = requestAnimationFrame(loop);
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      cancelAnimationFrame(raf);
    } else {
      last = performance.now();
      raf = requestAnimationFrame(function loop(now){
        frame(now);
        raf = requestAnimationFrame(loop);
      });
    }
  });
})();

/* Reveal the plain DOM heading when the shader cannot run, so the page still
   shows its name (background effects keep working where they can). */
function showFallback(){
  const t = document.getElementById('title');
  t.classList.add('fallback');
  t.addEventListener('click', fxDecrypt);
}
</script>
